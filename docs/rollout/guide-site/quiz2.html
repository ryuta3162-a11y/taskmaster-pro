<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="To Do List 理解度チェック Vol.2（全10問・約8分）" />
  <meta name="theme-color" content="#ffffff" />
  <title>理解度チェック Vol.2 | To Do List</title>
  <style>
    :root {
      --ink: #111111; --ink-2: #2b2b2b; --ink-3: #5c5c5c; --line: #d9d9d6; --line-2: #c4c4c0;
      --bg: #ffffff; --bg-soft: #f2f2ef; --hover: #ecebe8;
      --accent: #1a6fc4; --accent-soft: #e3eefa;
      --ok: #0b6b5d; --ok-soft: #d6ebd6; --ng: #c0392b; --ng-soft: #fadede; --tag: #ebe2fa; --tag-ink: #5a2f9a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
      font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 0 56px; }

    .topnav { height: 46px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); border-bottom: 1px solid var(--line); }
    .topnav .crumb-sep { color: var(--ink-3); }
    .topnav .logo { width: 20px; height: 20px; border-radius: 5px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; }

    .cover { height: 132px; background: linear-gradient(120deg, #e8eefc 0%, #efe8fb 50%, #fbeef3 100%); }
    .page-head { position: relative; padding-top: 0; }
    .page-icon { width: 76px; height: 76px; margin-top: -40px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(15,15,15,.08); display: flex; align-items: center; justify-content: center; }
    .page-icon svg { color: #6940a5; }
    h1 { font-size: 40px; font-weight: 700; letter-spacing: -.01em; margin: 18px 0 14px; line-height: 1.2; }

    .props { display: grid; grid-template-columns: 140px 1fr; row-gap: 6px; font-size: 14px; margin-bottom: 8px; max-width: 900px; }
    .props dt { color: var(--ink-3); font-weight: 600; display: flex; align-items: center; gap: 6px; padding: 5px 0; }
    .props dd { margin: 0; padding: 5px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill { display: inline-block; padding: 1px 9px; border-radius: 4px; background: var(--bg-soft); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink); }
    .pill.purple { background: var(--tag); color: var(--tag-ink); }
    .email-row { display: flex; gap: 8px; align-items: center; }
    #email { width: 360px; height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; outline: none; }
    #email:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn { height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line-2); background: #fff; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn:hover { background: var(--hover); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: #1a6fc4; }
    .btn:disabled { opacity: .6; cursor: default; }
    .msg { margin: 0; font-size: 13.5px; color: var(--ink-3); font-weight: 500; min-height: 1.2em; }
    .msg.is-error { color: var(--ng); font-weight: 600; }
    .msg.is-ok { color: var(--ok); font-weight: 600; }
    hr.divider { border: 0; border-top: 1px solid var(--line); margin: 22px 0 8px; }

    .callout { display: flex; gap: 12px; background: #fbf3db; border: 1px solid #ecd9a3; border-radius: 6px; padding: 14px 16px; margin: 18px 0 8px; font-size: 14.5px; font-weight: 600; color: var(--ink); }

    /* 問題 */
    #questions { padding-bottom: 24px; }
    .q { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; padding: 32px 0; border-bottom: 1px solid var(--line); }
    .q:last-child { border-bottom: 0; }
    .q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .q-num { font-weight: 800; font-size: 13.5px; color: var(--ink-2); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
    .q-tag { font-size: 12.5px; padding: 1px 8px; border-radius: 4px; background: var(--tag); color: var(--tag-ink); font-weight: 600; }
    .case { border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05); }
    .case-name { font-weight: 700; color: var(--ink); font-size: 14.5px; padding: 10px 14px; background: var(--bg-soft); border-bottom: 1px solid var(--line); }
    .case-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .case-table th { width: 32%; text-align: left; font-weight: 600; color: var(--ink-3); padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .case-table td { font-weight: 600; color: var(--ink); padding: 8px 14px; border-bottom: 1px solid var(--line); }
    .case-table tr:last-child th, .case-table tr:last-child td { border-bottom: 0; }
    .case-table td.is-low { color: var(--ng); font-weight: 700; }
    .q-scene { margin: 0; font-size: 15.5px; color: var(--ink-2); line-height: 1.9; font-weight: 500; }

    .q-main { border: 0; margin: 0; padding: 0; min-width: 0; }
    .q-ask { padding: 0; font-size: 20px; font-weight: 800; color: var(--ink); line-height: 1.6; margin: 26px 0 14px; }
    .opts { display: grid; gap: 8px; }
    .opt { display: flex; align-items: flex-start; gap: 12px; padding: 13px 15px; border: 1px solid var(--line-2); border-radius: 8px; cursor: pointer; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.04); transition: background .12s, border-color .12s, box-shadow .12s; }
    .opt:hover { background: var(--hover); }
    .opt input { position: absolute; opacity: 0; pointer-events: none; }
    .opt-key { flex: none; width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--line-2); display: inline-flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800; color: var(--ink-2); background: #fff; margin-top: 1px; }
    .opt-text { font-size: 15.5px; line-height: 1.65; font-weight: 600; color: var(--ink); }
    .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent) inset; }
    .opt:has(input:checked) .opt-key { background: var(--accent); border-color: var(--accent); color: #fff; }
    .opt:has(input:focus-visible) { box-shadow: 0 0 0 3px var(--accent-soft); }
    #questions.is-locked .opt { cursor: not-allowed; background: #fff; }
    #questions.is-locked .opt:hover { background: #fff; }
    .q.is-wrong .q-ask { color: var(--ng); }
    .q.is-right .q-ask::after { content: '  ✓'; color: var(--ok); }
    .explain { margin: 12px 0 0; font-size: 14.5px; font-weight: 600; border-radius: 6px; padding: 10px 14px; line-height: 1.8; }
    .explain.ok { background: var(--ok-soft); color: var(--ok); }
    .explain.ng { background: var(--ng-soft); color: #8e1f15; }
    .explain a { color: inherit; font-weight: 600; }

    /* 送信バー */
    .submit-bar { position: sticky; bottom: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-top: 1px solid var(--line); z-index: 5; }
    .submit-inner { display: flex; align-items: center; gap: 16px; height: 64px; }
    .progress-track { width: 240px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
    #progress-bar { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
    .progress-text { font-size: 14px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
    #submit { margin-left: auto; height: 38px; padding: 0 22px; }
    #submit-msg { max-width: 520px; }

    /* 結果 */
    .result { margin: 22px 0 0; border-radius: 8px; padding: 20px 22px; }
    .result h2 { margin: 0 0 6px; font-size: 20px; }
    .result p { margin: 0; color: var(--ink-2); }
    .result.fail { background: var(--ng-soft); }
    .result.fail h2 { color: #9f2f2b; }
    .result.pass { background: var(--ok-soft); }
    .result.celebrate { position: relative; overflow: hidden; text-align: center; padding: 40px 24px 36px; animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
    .result.celebrate h2 { font-size: 28px; margin: 10px 0 12px; color: var(--ink); }
    .result.celebrate p { line-height: 1.9; }
    .celebrate-badge { display: inline-block; margin: 0; padding: 3px 14px; border-radius: 999px; background: var(--ok); color: #fff !important; font-weight: 700; font-size: 13px; letter-spacing: .08em; }
    .confetti { position: absolute; inset: 0; pointer-events: none; }
    .confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; opacity: 0; animation-name: fall; animation-timing-function: ease-in; animation-fill-mode: forwards; }
    @keyframes fall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(300px) rotate(540deg); opacity: 0; } }
    @keyframes pop { 0% { transform: scale(.96); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .result.celebrate { animation: none; } }

    @media (max-width: 900px) {
      .wrap { padding: 0 20px; }
      .q { grid-template-columns: 1fr; gap: 0; }
      h1 { font-size: 30px; }
      #email { width: 100%; }
      .props { grid-template-columns: 1fr; }
      .progress-track { width: 100px; }
    }
  </style>
</head>
<body>
  <div class="wrap topnav">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
    <span>To Do List</span><span class="crumb-sep">/</span><span>理解度チェック Vol.2</span>
  </div>
  <div class="cover" aria-hidden="true"></div>

  <form id="quiz-form" novalidate>
    <div class="wrap page-head">
      <div class="page-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <h1>理解度チェック Vol.2</h1>

      <dl class="props">
        <dt>問題数</dt><dd><span class="pill">10問</span><span class="pill">約8分</span><span class="pill purple">全問正解で合格</span></dd>
        <dt>メールアドレス</dt>
        <dd>
          <span class="email-row">
            <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="name@okamoto-group.co.jp" required aria-describedby="email-msg" />
            <button type="button" class="btn btn-primary" id="verify">確認</button>
          </span>
          <p class="msg" id="email-msg">入力して「確認」を押すと回答できます。</p>
        </dd>
      </dl>

      <div id="result" class="result" hidden aria-live="polite"></div>

      <div class="callout">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#cb912f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V17h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2z"/></svg>
        <span>左の状況を読んで、右の問いにいちばん合うものを1つ選んでください。全問回答したら、下の「結果を送信」を押します。</span>
      </div>
      <hr class="divider" />

      <div id="questions" class="is-locked"></div>
    </div>

    <div class="submit-bar">
      <div class="wrap submit-inner">
        <span class="progress-track"><span id="progress-bar"></span></span>
        <span class="progress-text" id="progress">0 / 10 問回答</span>
        <p class="msg" id="submit-msg" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary" id="submit">結果を送信</button>
      </div>
    </div>
  </form>

  <script src="guide-config.js?v=20261009a"></script>
  <script src="quiz2.js?v=20261009i"></script>
</body>
</html>
