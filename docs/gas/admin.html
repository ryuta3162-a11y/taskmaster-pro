<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理ダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* タイポグラフィ（index の appText と同階層） */
      --tm-title: 1rem;
      --tm-section: 0.875rem;
      --tm-body: 0.875rem;
      --tm-meta: 0.75rem;
      --tm-badge: 0.6875rem;
      --acc-50: oklch(96.2% 0.018 272.314);
      --acc-100: oklch(93% 0.034 272.788);
      --acc-200: oklch(87% 0.065 274.039);
      --acc-300: oklch(78.5% 0.115 274.713);
      --acc-400: oklch(67.3% 0.182 276.935);
      --acc-500: oklch(58.5% 0.233 277.117);
      --acc-600: oklch(51.1% 0.262 276.966);
      --acc-700: oklch(45.7% 0.24 277.023);
      --acc-900: oklch(35.9% 0.144 278.697);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #f2f2f7;
      font-family: 'Noto Sans JP', system-ui, sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .shell {
      display: flex; flex-direction: column; min-height: 100dvh;
      max-width: 32rem; margin: 0 auto; width: 100%;
    }
    @media (min-width: 768px) {
      .shell { max-width: none; }
    }

    /* --- header（利用者アプリと同型） --- */
    .topbar {
      position: sticky; top: 0; z-index: 40; flex-shrink: 0;
      height: 3.5rem;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,.06);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1rem;
    }
    @media (min-width: 768px) { .topbar { height: 4rem; padding: 0 2rem; } }
    .brand-wrap { display: flex; align-items: center; gap: .75rem; min-width: 0; flex: 1; }
    .brand-mark {
      width: 2.25rem; height: 2.25rem; border-radius: 10px;
      background: var(--acc-500); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,.06); flex-shrink: 0;
    }
    .brand-mark svg { width: 1.1rem; height: 1.1rem; stroke-width: 3; }
    .brand-col { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .brand-col .sub {
      font-size: 7px; font-weight: 600; letter-spacing: .18em;
      color: #64748b; text-transform: uppercase;
    }
    @media (min-width: 640px) { .brand-col .sub { font-size: 8px; } }
    .brand-col h1 {
      margin: 0; font-size: 1rem; font-weight: 700;
      letter-spacing: -.02em; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    @media (min-width: 640px) { .brand-col h1 { font-size: 1.125rem; } }
    .brand-col h1.sm-only { display: block; }
    @media (min-width: 640px) {
      .brand-col { display: flex; }
      .brand-col h1.sm-only { display: none; }
    }
    .page-title {
      font-size: .875rem; font-weight: 600; color: #64748b;
      letter-spacing: -.01em; margin-left: .25rem; white-space: nowrap;
    }
    @media (max-width: 639px) { .page-title { display: none; } }

    .account-wrap { position: relative; flex-shrink: 0; }
    .account-btn {
      width: 2.25rem; height: 2.25rem; border-radius: 9999px; border: none; cursor: pointer;
      background: linear-gradient(to bottom right, var(--acc-500), var(--acc-700));
      color: #fff; font-size: .875rem; font-weight: 700;
      box-shadow: 0 0 0 2px #fff, 0 4px 14px -4px var(--acc-500);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s;
    }
    .account-btn:active { transform: scale(.95); }
    .menu-backdrop {
      display: none; position: fixed; inset: 0; z-index: 45;
      background: rgba(0,0,0,.2); backdrop-filter: blur(2px);
    }
    .menu-backdrop.open { display: block; }
    .account-menu {
      display: none; position: absolute; right: 0; top: calc(100% + .5rem);
      width: min(18rem, 92vw); max-height: min(88vh, 36rem);
      background: rgba(255,255,255,.95); backdrop-filter: blur(16px);
      border-radius: 1rem; border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 20px 50px rgba(0,0,0,.15); z-index: 50; overflow: hidden;
      flex-direction: column;
    }
    .account-menu.open { display: flex; }
    .menu-head { padding: 1rem; border-bottom: 1px solid #f1f5f9; }
    .menu-head .who { font-weight: 600; font-size: .9rem; color: #0f172a; word-break: break-all; }
    .menu-head .mail { font-size: 11px; color: #64748b; margin-top: .15rem; word-break: break-all; }
    .menu-meta { padding: .65rem 1rem; font-size: .68rem; color: #64748b; font-weight: 500; border-bottom: 1px solid #f1f5f9; }
    .menu-accent { padding: .75rem 1rem; border-top: 1px solid #e2e8f0; background: linear-gradient(to bottom, #f8fafc, #fff); }
    .menu-accent label {
      display: block; font-size: 9px; font-weight: 800; letter-spacing: .12em;
      text-transform: uppercase; color: var(--acc-600); margin-bottom: .5rem;
    }
    .accent-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .35rem; }
    .accent-swatch {
      height: 2rem; border-radius: .5rem; border: 2px solid #e2e8f0;
      cursor: pointer; padding: 0; transition: all .15s;
    }
    .accent-swatch.on { border-color: #0f172a; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0f172a; }
    .accent-current { text-align: center; font-size: 10px; font-weight: 700; color: #64748b; margin-top: .5rem; }
    .accent-current span { color: var(--acc-700); }
    .menu-actions { padding: .5rem; border-top: 1px solid #f1f5f9; background: rgba(248,250,252,.8); }
    .menu-link {
      display: flex; align-items: center; gap: .5rem; width: 100%;
      padding: .65rem .75rem; border: none; background: transparent;
      border-radius: .75rem; font-size: .8rem; font-weight: 600; color: #334155;
      cursor: pointer; text-decoration: none; text-align: left;
    }
    .menu-link:hover { background: #f1f5f9; }

    /* --- main --- */
    .main { flex: 1; overflow: auto; padding: 1rem .25rem 6rem; background: #f2f2f7; }
    @media (min-width: 768px) { .main { padding: 1.5rem 1rem 6rem; } }
    .main-inner { max-width: 120rem; margin: 0 auto; width: 100%; padding: 0 .25rem; }
    @media (min-width: 768px) { .main-inner { padding: 0 1rem; } }
    .stack { display: flex; flex-direction: column; gap: 1rem; margin-top: .25rem; width: 100%; }

    /* ステータスバー（トップ画面と同型） */
    .status-strip {
      background: #fff; border-radius: 1rem;
      padding: .75rem 1rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid rgba(0,0,0,.04);
      display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem .9rem;
      font-size: .875rem; color: #475569;
    }
    .status-strip strong { color: #0f172a; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
    .status-strip .sep { color: #cbd5e1; user-select: none; }
    .status-strip .accent strong { color: var(--acc-700); }

    /* モード切替 */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: .5rem;
      width: 100%;
    }
    @media (max-width: 900px) {
      .mode-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .45rem; }
    }
    @media (max-width: 560px) {
      .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem; }
    }
    .mode-nav-tile {
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: .9rem;
      padding: .85rem .55rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      border: 1px solid rgba(0,0,0,.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s, background .15s;
      min-height: 4.75rem;
    }
    @media (min-width: 900px) {
      .mode-nav-tile { padding: 1rem .75rem; min-height: 5.25rem; border-radius: 1rem; gap: .55rem; }
    }
    .mode-nav-tile:hover {
      border-color: color-mix(in oklch, var(--acc-300) 55%, transparent);
      box-shadow: 0 4px 16px -8px rgba(0,0,0,.12);
    }
    .mode-nav-tile:active { transform: scale(.985); }
    .mode-nav-tile.on {
      background: linear-gradient(180deg, color-mix(in oklch, var(--acc-50) 80%, #fff), #fff);
      border-color: color-mix(in oklch, var(--acc-500) 45%, transparent);
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 0 0 2px color-mix(in oklch, var(--acc-500) 16%, transparent);
    }
    .mode-nav-tile.on .mode-nav-icon {
      background: linear-gradient(to bottom right, var(--acc-500), var(--acc-700));
      color: #fff;
    }
    .mode-nav-icon {
      width: 2.35rem;
      height: 2.35rem;
      border-radius: .7rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--acc-50);
      color: var(--acc-700);
    }
    @media (min-width: 900px) {
      .mode-nav-icon { width: 2.65rem; height: 2.65rem; border-radius: .75rem; }
    }
    .mode-nav-icon svg { width: 1.15rem; height: 1.15rem; }
    .mode-nav-label {
      margin: 0;
      font-size: .78rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
      letter-spacing: .01em;
    }
    @media (min-width: 900px) {
      .mode-nav-label { font-size: .88rem; }
    }

    /* PanelFrame + chip arena（フィルタ用） */
    .panel-frame {
      position: relative; border-radius: 1rem; overflow: hidden;
      border: 1px solid color-mix(in oklch, var(--acc-300) 40%, transparent);
      box-shadow: 0 8px 32px -12px rgba(0,0,0,.1);
    }
    .panel-frame::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to bottom right, color-mix(in oklch, var(--acc-50) 75%, transparent), #fff, #f8fafc);
    }
    .panel-frame::after {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(to bottom, var(--acc-300), var(--acc-500), var(--acc-700));
    }
    .panel-inner { position: relative; padding: 1rem 1rem 1rem 1.35rem; }
    .chip-arena {
      display: flex; flex-direction: column; gap: .65rem;
      border-radius: .75rem;
      border: 1px solid color-mix(in oklch, var(--acc-200) 45%, transparent);
      background: linear-gradient(to bottom, rgba(15,23,42,.03), #fff, color-mix(in oklch, var(--acc-50) 25%, transparent));
      padding: .75rem;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.05);
    }
    .chip-arena .filter-block {
      margin: 0; padding: 0; border: none; background: transparent;
    }
    .chip-arena .filter-block + .filter-block {
      margin-top: 0; padding-top: .55rem;
      border-top: 1px solid #e2e8f0;
    }
    .chip-row {
      display: flex; flex-wrap: wrap; gap: .5rem;
    }
    .chip {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 2.5rem; padding: .5rem .85rem; border-radius: .75rem;
      font-size: var(--tm-body); font-weight: 600; cursor: pointer; border: none;
      background: rgba(255,255,255,.9); color: #334155;
      border: 1px solid color-mix(in oklch, var(--acc-200) 60%, transparent);
      transition: all .15s;
    }
    .chip:hover { border-color: var(--acc-400); background: color-mix(in oklch, var(--acc-50) 60%, white); }
    .chip.on {
      background: linear-gradient(to bottom right, var(--acc-500), var(--acc-700));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px -4px var(--acc-500);
    }
    .badge-type-new { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
    .badge-type-repost { background: var(--acc-50); color: var(--acc-900); border: 1px solid var(--acc-200); }
    .badge-type-remind { background: color-mix(in oklch, var(--acc-100) 70%, #fff); color: var(--acc-900); border: 1px solid var(--acc-200); }

    /* 依頼カード（常時ワンボックス表示） */
    .task-list { display: flex; flex-direction: column; gap: .75rem; }
    .task-card {
      width: 100%; background: #fff;
      border-radius: 1rem; padding: 1.1rem 1.25rem 1.2rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid rgba(0,0,0,.04);
    }
    @media (min-width: 768px) { .task-card { padding: 1.25rem 1.4rem 1.35rem; } }
    .badges { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .55rem; }
    .badge {
      font-size: .65rem; font-weight: 700; padding: .12rem .45rem; border-radius: .4rem;
    }
    .badge-run { background: var(--acc-50); color: var(--acc-900); border: 1px solid var(--acc-200); }
    .badge-ok { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .badge-late { background: var(--acc-50); color: var(--acc-900); border: 1px solid var(--acc-200); }
    .badge-kind-e { background: linear-gradient(to right, var(--acc-600), var(--acc-700)); color: #fff; }
    .badge-kind-s { background: var(--acc-900); color: #fff; }
    .task-metrics {
      display: flex; flex-wrap: wrap; gap: .35rem .85rem;
      margin: 0 0 .55rem; font-size: .92rem; font-weight: 700; color: #334155;
    }
    .task-metrics strong {
      color: var(--acc-700); font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .task-metrics .unit { font-weight: 600; color: #64748b; }
    .task-meta { font-size: var(--tm-meta); color: #64748b; font-weight: 500; margin: 0 0 .75rem; }
    .task-card .detail-body {
      margin: 0 0 .85rem;
      background: color-mix(in oklch, var(--acc-50) 35%, #fff);
      border-color: color-mix(in oklch, var(--acc-200) 55%, transparent);
    }
    .task-card .detail-block { margin: 0 0 .85rem; }
    .task-card .detail-block:last-child { margin-bottom: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .55rem 1rem; font-size: .8rem; font-weight: 600; border-radius: 1rem;
      border: 1px solid rgba(0,0,0,.06); background: #fff; color: #334155;
      cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .btn-primary {
      background: var(--acc-500); color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px -4px var(--acc-500);
    }
    .btn-primary:hover { background: var(--acc-600); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-sm { padding: .4rem .75rem; font-size: .75rem; }

    .detail-label {
      display: block; font-size: .72rem; font-weight: 800; letter-spacing: .04em;
      color: #64748b; margin-bottom: .45rem;
    }
    .detail-body {
      font-size: .95rem; font-weight: 600; color: #0f172a; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
      padding: .85rem 1rem; border-radius: .75rem;
      background: #fff; border: 1px solid #e2e8f0;
    }
    .pending-name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr));
      gap: .45rem .55rem;
    }
    @media (min-width: 900px) {
      .pending-name-grid { grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
    }
    .pending-name {
      display: flex; align-items: center; gap: .4rem;
      padding: .55rem .7rem; border-radius: .65rem;
      background: var(--acc-50); border: 1px solid color-mix(in oklch, var(--acc-200) 70%, transparent);
      font-size: .88rem; font-weight: 700; color: #0f172a;
      line-height: 1.35; word-break: break-word;
    }
    .pending-name::before {
      content: ''; width: .45rem; height: .45rem; border-radius: 50%;
      background: var(--acc-500); flex-shrink: 0;
    }
    .pending-empty {
      padding: .75rem .9rem; border-radius: .75rem;
      background: color-mix(in oklch, var(--acc-50) 50%, #fff);
      border: 1px solid color-mix(in oklch, var(--acc-200) 55%, transparent);
      font-size: .88rem; font-weight: 700; color: var(--acc-800, var(--acc-700));
    }
    .done-rank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
      gap: .45rem .55rem;
    }
    .done-rank {
      display: flex; align-items: center; gap: .55rem;
      padding: .5rem .7rem; border-radius: .65rem;
      background: #f8fafc; border: 1px solid #e2e8f0;
      font-size: .88rem; font-weight: 700; color: #0f172a; line-height: 1.35;
    }
    .done-rank-no {
      flex-shrink: 0; min-width: 1.9rem; height: 1.9rem; padding: 0 .3rem; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--acc-700); color: #fff; font-size: .78rem; font-weight: 800;
    }
    .done-rank-body { min-width: 0; display: flex; flex-direction: column; }
    .done-rank-name { word-break: break-word; }
    .done-rank-time { font-size: .72rem; font-weight: 600; color: #64748b; }
    .pending-toggle { margin-top: .2rem; }
    .pending-toggle > summary {
      display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; list-style: none;
      padding: .5rem .9rem; border-radius: .65rem; border: 1px solid #e2e8f0; background: #fff;
      font-size: .82rem; font-weight: 800; color: #334155;
    }
    .pending-toggle > summary::-webkit-details-marker { display: none; }
    .pending-toggle > summary::after { content: '▼'; font-size: .6rem; color: #94a3b8; }
    .pending-toggle[open] > summary::after { content: '▲'; }
    .pending-toggle[open] > summary { margin-bottom: .6rem; }

    .empty, .loading {
      text-align: center; padding: 3rem 1rem; font-weight: 600; font-size: .9rem; color: #94a3b8;
    }
    .loading { color: var(--acc-600); }
    .err {
      padding: 1.5rem; text-align: center; font-weight: 600; color: var(--acc-800, #334155);
      background: #fff; border-radius: 1rem; border: 1px solid var(--acc-200);
    }

    .intro-block {
      margin: 0 0 .75rem; padding: .65rem .8rem;
      border-radius: .8rem; background: #fff;
      border: 1px solid color-mix(in oklch, var(--acc-200) 50%, transparent);
    }
    .intro-block label {
      display: flex; align-items: center; justify-content: space-between;
      font-size: var(--tm-meta); font-weight: 700; color: var(--acc-700);
      margin-bottom: .35rem;
    }
    .intro-block label .right { display: flex; gap: .35rem; }
    .intro-block textarea {
      width: 100%; min-height: 5.5rem; resize: vertical;
      border: 1px solid #e2e8f0; border-radius: .55rem;
      padding: .55rem .65rem; font-size: .82rem; line-height: 1.55;
      font-family: inherit; color: #0f172a;
      background: #fafafe; outline: none;
    }
    .intro-block textarea:focus { border-color: var(--acc-400); background: #fff; }
    .btn-link {
      background: transparent; border: none; padding: 0;
      font-size: .7rem; font-weight: 700; color: var(--acc-600); cursor: pointer;
    }
    .btn-link:hover { text-decoration: underline; }
    .send-note {
      margin: .75rem 0 0; padding: .6rem .75rem; border-radius: .65rem;
      background: color-mix(in oklch, var(--acc-50) 60%, white);
      border: 1px solid color-mix(in oklch, var(--acc-200) 50%, transparent);
      font-size: .7rem; color: #475569; line-height: 1.5;
    }
    .send-note strong { color: var(--acc-700); }

    /* リマインド効果 */
    .effect-summary {
      background: #fff; border-radius: 1rem;
      padding: 1rem 1.15rem 1.15rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid rgba(0,0,0,.04);
    }
    .effect-summary h3 {
      margin: 0 0 .35rem; font-size: 1rem; font-weight: 800; color: #0f172a;
    }
    .effect-summary .effect-lead {
      margin: 0 0 .9rem; font-size: .78rem; color: #64748b; line-height: 1.5; font-weight: 600;
    }
    .effect-stages {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .55rem;
    }
    @media (max-width: 900px) {
      .effect-stages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .effect-stages { grid-template-columns: 1fr; }
    }
    .effect-stage {
      border-radius: .85rem;
      padding: .75rem .8rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .effect-stage.is-overdue {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .effect-stage.is-overdue .pct { color: #0f172a; }
    .effect-stage.is-na .pct { color: #94a3b8; font-size: 1.35rem; }
    .effect-stage .lbl {
      display: block; font-size: .68rem; font-weight: 800;

          el.classList.toggle('on', el.getAttribute('data-id') === t.id);

      function readAccent() {
        try {
          var v = localStorage.getItem(ACCENT_STORAGE_KEY);
          if (v === 'indigo') {
            try { localStorage.setItem(ACCENT_STORAGE_KEY, 'black'); } catch (e2) {}
            return 'black';
          }
          if (v && ACCENT_THEMES.some(function (t) { return t.id === v; })) return v;
        } catch (e) {}

      function selKey(taskId, key) { return taskId + '::' + key; }

      function getTasksForMode() {
        if (!lastData) return [];
        if (mode === 'combined') {
          return [].concat(lastData.employeeTasks || [], lastData.storeTasks || []);
        }
        if (mode === 'employee') return lastData.employeeTasks || [];
        if (mode === 'store') return lastData.storeTasks || [];
        if (mode === 'tf') return lastData.tfTasks || [];
        return [];
      }

      function taskUnitLabel(t) {
        return t && t.requestKind === 'store' ? '店舗' : '名';
      }

      function taskPendingLabel(t) {
        return t && t.requestKind === 'store' ? '未完了の店舗' : '未実施者';
      }

      function normalizePostType(type) {
        var t = String(type || '').trim();
        if (t.indexOf('リマインド') >= 0) return 'remind';
        if (t.indexOf('再投稿') >= 0) return 'repost';
        return 'new';
      }

      function postTypeBadgeClass(type) {
        var pt = normalizePostType(type);
        if (pt === 'remind') return 'badge-type-remind';
        if (pt === 'repost') return 'badge-type-repost';
        return 'badge-type-new';
      }

      function taskCreatedSortKey(t) {
        if (t && t.createdAt) {
          var raw = String(t.createdAt).trim().replace(/\//g, '-');
          var d = Date.parse(raw);
          if (!isNaN(d)) return d;
        }
        var m = String((t && t.id) || '').match(/t_(\d+)/);
        if (m) return Number(m[1]);
        var dl = Date.parse(String((t && t.deadline) || ''));
        return isNaN(dl) ? 0 : dl;
      }

      function filterTasks(list) {
        var filtered = (list || []).filter(function (t) {
          if (typeFilter !== 'all' && normalizePostType(t.type) !== typeFilter) return false;
          if (filter === 'open') return !t.complete;
          if (filter === 'late') return !t.complete && t.overdue;
          return true;
        });
        filtered.sort(function (a, b) {
          var ka = taskCreatedSortKey(a);
          var kb = taskCreatedSortKey(b);
          return sortOrder === 'asc' ? (ka - kb) : (kb - ka);
        });
        return filtered;
      }

      function getTaskPeopleStats(t) {
        var recipients = getCountableRecipients(t.recipients || []);
        var total = recipients.length;
        var pending = 0;
        for (var i = 0; i < recipients.length; i++) {
          if (!recipients[i].done) pending++;
        }
        var done = total - pending;
        var rate = total ? Math.round((done / total) * 100) : (t.complete ? 100 : (typeof t.progressPct === 'number' ? t.progressPct : 0));
        return { total: total, pending: pending, done: done, rate: rate };
      }

      function getMedianRate(list) {
        var rates = (list || []).map(function (t) {
          return getTaskPeopleStats(t).rate;
        }).sort(function (a, b) {
          return a - b;
        });
        if (!rates.length) return 0;
        var mid = Math.floor(rates.length / 2);
        if (rates.length % 2) return rates[mid];
        return Math.round((rates[mid - 1] + rates[mid]) / 2);
      }

      function getAggregateTaskStats(list) {
        var targetSum = 0;
        var pendingSum = 0;
        (list || []).forEach(function (t) {
          var st = getTaskPeopleStats(t);
          targetSum += st.total;
          pendingSum += st.pending;
        });
        var doneSum = targetSum - pendingSum;
        return {
          taskCount: (list || []).length,
          targetSum: targetSum,
          pendingSum: pendingSum,
          doneSum: doneSum,
          overallRate: targetSum ? Math.round((doneSum / targetSum) * 100) : 0,
          medianRate: getMedianRate(list)
        };
      }

      function renderTaskList() {
        var list = filterTasks(getTasksForMode());

        var h = '<div class="task-list">';
        list.forEach(function (t) {
          var unit = taskUnitLabel(t);

          var doneList = recipients.filter(function (r) { return r.done; });
          doneList.sort(function (a, b) {

            var kb = b.doneAt == null ? Infinity : b.doneAt;
            if (ka !== kb) return ka - kb;
            return (a.doneOrder == null ? 0 : a.doneOrder) - (b.doneOrder == null ? 0 : b.doneOrder);
          });
          var doneLabel = t.requestKind === 'store' ? '完了した店舗（早い順）' : '実施者（早い順）';

                h += '<div class="done-rank"><span class="done-rank-no">' + (i + 1) + '</span>';
                h += '<span class="done-rank-body"><span class="done-rank-name">' + esc(name) + '</span>';
                if (sub) h += '<span class="done-rank-time">' + esc(sub) + '</span>';
                h += '</span></div>';
              });

              h += '<div class="pending-empty">全員完了しています</div>';

              });

              h += '<div class="pending-name-grid">';
              pending.forEach(function (r) {
                h += '<div class="pending-name">' + esc(r.label || r.name || r.storeName || '—') + '</div>';
              });

            h += '</div>';

          h += '</article>';
        });
        h += '</div>';
        return h;
      }

      function bindTaskEvents() {
        document.querySelectorAll('.task-card a').forEach(function (a) {

      }

      /* ================= 分析サマリー ================= */
      var AN = {
        data: null, loading: false,
        unit: 'all', key: '', kind: 'all', excl: true,
        reqSort: { k: 'tasks', d: -1 }, execSort: { k: 'handled', d: -1 },
        reqAll: false, execAll: false, execQuery: '', execRole: ''
      };
      var AN_KIND = { employee: { label: '社員', color: 'var(--acc-700)' }, store: { label: '店舗', color: 'var(--acc-400)' }, tf: { label: 'TF', color: 'var(--acc-200)' } };

      function ensureAnalytics() {
        if (AN.data || AN.loading) return;
        AN.loading = true;
        if (mode === 'analytics') document.getElementById('root').innerHTML = '<div class="loading">分析データを集計中…</div>';
        google.script.run
          .withSuccessHandler(function (d) {
            AN.loading = false;
            if (!d || !d.ok) { if (mode === 'analytics') showError((d && d.message) || '分析データの読み込みに失敗しました'); return; }
            AN.data = d;
            if (mode === 'analytics') renderAll();
          })
          .withFailureHandler(function (e) {
            AN.loading = false;
            if (mode === 'analytics') showError(e && e.message ? e.message : String(e));
          })
          .getAdminAnalyticsData();
      }

      function anPad(n) { return (n < 10 ? '0' : '') + n; }
      function anFy(d) { return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; }
      function anKeyOf(unit, d) {
        if (unit === 'month') return d.getFullYear() + '-' + anPad(d.getMonth() + 1);
        if (unit === 'half') return anFy(d) + '-' + (d.getMonth() >= 3 && d.getMonth() <= 8 ? 'H1' : 'H2');
        if (unit === 'fy') return String(anFy(d));
        return 'all';
      }
      function anLabel(unit, key) {
        if (unit === 'month') { var p = key.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
        if (unit === 'half') { var h = key.split('-'); return h[0] + '年度 ' + (h[1] === 'H1' ? '上期（4〜9月）' : '下期（10〜3月）'); }
        if (unit === 'fy') return key + '年度（4月〜翌3月）';
        return '全期間';
      }
      function anKeys(unit) {
        if (unit === 'all') return ['all'];
        var set = {};
        AN.data.tasks.forEach(function (t) { set[anKeyOf(unit, new Date(t.c))] = 1; });
        set[anKeyOf(unit, new Date())] = 1;
        return Object.keys(set).sort();
      }
      function anPrevKey(unit, key) {
        if (unit === 'all') return null;
        var ks = anKeys(unit), i = ks.indexOf(key);
        return i > 0 ? ks[i - 1] : null;
      }
      function anPct(a, b) { return b ? Math.round(a / b * 1000) / 10 : null; }
      function anPctText(v) { return v == null ? '—' : (Math.round(v) + '%'); }
      function anPill(v) {
        if (v == null) return '<span class="an-pill n">—</span>';
        var c = v >= 90 ? 'g' : v >= 70 ? 'y' : 'r';
        return '<span class="an-pill ' + c + '">' + Math.round(v) + '%</span>';
      }
      function anHours(h) {
        if (h == null) return '—';
        if (h < 24) return (Math.round(h * 10) / 10) + '時間';
        return (Math.round(h / 24 * 10) / 10) + '日';
      }
      function anMedian(arr) {
        if (!arr.length) return null;
        var s = arr.slice().sort(function (a, b) { return a - b; });
        var m = Math.floor(s.length / 2);
        return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
      }
      function anSplit(s) {
        return String(s || '').split(/[,、\/／|｜]/).map(function (x) { return x.replace(/[:：].*$/, '').trim(); }).filter(Boolean);
      }

      function anUnitsByTask() {
        if (AN.data._byTask) return AN.data._byTask;
        var by = AN.data.tasks.map(function () { return []; });
        AN.data.units.forEach(function (u) { if (by[u[0]]) by[u[0]].push(u); });
        AN.data._byTask = by;
        return by;
      }
      function anUnitOk(u, t) {
        if (!AN.excl || t.k === 'store') return true;
        var p = AN.data.people[u[1]];
        return !(p && (AN.data.excludeRoles || []).indexOf(p.r) >= 0);
      }
      function anSelectTasks(unit, key) {
        var out = [];
        AN.data.tasks.forEach(function (t, i) {
          if (AN.kind !== 'all' && t.k !== AN.kind) return;
          if (unit !== 'all' && anKeyOf(unit, new Date(t.c)) !== key) return;
          out.push(i);
        });
        return out;
      }

      function anAggregate(tis) {
        var by = anUnitsByTask();
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var todayStr = today.getFullYear() + '-' + anPad(today.getMonth() + 1) + '-' + anPad(today.getDate());
        var A = { tasks: tis.length, units: 0, done: 0, onTime: 0, overdueOpen: 0, hours: [], kinds: { employee: 0, store: 0, tf: 0 },
          requesters: {}, executors: {}, targetsP: {}, perTask: [] };
        tis.forEach(function (ti) {
          var t = AN.data.tasks[ti];
          A.kinds[t.k] = (A.kinds[t.k] || 0) + 1;
          A.requesters[t.s] = 1;
          var pastDue = t.d && t.d < todayStr;
          var tu = 0, td = 0, to = 0;
          by[ti].forEach(function (u) {
            if (!anUnitOk(u, t)) return;
            tu++; td += u[3]; to += u[4];
            if (u[3] && u[5] != null) A.hours.push(u[5]);
            if (!u[3] && pastDue) A.overdueOpen++;
            if (u[3] && u[1] >= 0) A.executors[u[1]] = 1;
            if (t.k !== 'store' && u[1] >= 0) A.targetsP[u[1]] = 1;
          });
          A.units += tu; A.done += td; A.onTime += to;
          A.perTask.push({ ti: ti, total: tu, done: td, onTime: to, pastDue: pastDue });
        });
        A.rate = anPct(A.done, A.units);
        A.onTimeRate = anPct(A.onTime, A.units);
        A.medianHours = anMedian(A.hours);
        A.requesterCount = Object.keys(A.requesters).length;
        A.executorCount = Object.keys(A.executors).length;
        A.targetPeopleCount = Object.keys(A.targetsP).length;
        return A;
      }

      function anRequesterRows(tis) {
        var by = anUnitsByTask(), map = {};
        tis.forEach(function (ti) {
          var t = AN.data.tasks[ti];
          var r = map[t.s] || (map[t.s] = { name: t.s, pi: t.sp, tasks: 0, employee: 0, store: 0, tf: 0, units: 0, done: 0, onTime: 0, hours: [] });
          r.tasks++; r[t.k] = (r[t.k] || 0) + 1;
          by[ti].forEach(function (u) {
            if (!anUnitOk(u, t)) return;
            r.units++; r.done += u[3]; r.onTime += u[4];
            if (u[3] && u[5] != null) r.hours.push(u[5]);
          });
        });
        return Object.keys(map).map(function (k) {
          var r = map[k], p = AN.data.people[r.pi];
          r.team = p ? p.t : ''; r.role = p ? p.r : '';
          r.rate = anPct(r.done, r.units); r.onTimeRate = anPct(r.onTime, r.units); r.med = anMedian(r.hours);
          return r;
        });
      }

      function anExecutorRows(tis) {
        var by = anUnitsByTask(), map = {};
        function rowOf(pi) {
          var p = AN.data.people[pi] || {};
          return map[pi] || (map[pi] = { pi: pi, name: p.n || '—', role: p.r || '', team: p.t || '', area: p.a || '', reg: p.reg,
            targets: 0, done: 0, onTime: 0, storeOps: 0, hours: [] });
        }
        tis.forEach(function (ti) {
          var t = AN.data.tasks[ti];
          by[ti].forEach(function (u) {
            if (u[1] < 0 || !anUnitOk(u, t)) return;
            if (t.k === 'store') {
              if (u[3]) { var s = rowOf(u[1]); s.storeOps++; if (u[5] != null) s.hours.push(u[5]); }
            } else {
              var r = rowOf(u[1]);
              r.targets++; r.done += u[3]; r.onTime += u[4];
              if (u[3] && u[5] != null) r.hours.push(u[5]);
            }
          });
        });
        return Object.keys(map).map(function (k) {
          var r = map[k];
          r.handled = r.done + r.storeOps;
          r.rate = anPct(r.done, r.targets); r.onTimeRate = anPct(r.onTime, r.targets); r.med = anMedian(r.hours);
          r.pending = r.targets - r.done;
          return r;
        });
      }

      function anSortRows(rows, s) {
        return rows.slice().sort(function (a, b) {
          var x = a[s.k], y = b[s.k];
          if (x == null) x = s.d < 0 ? -Infinity : Infinity;
          if (y == null) y = s.d < 0 ? -Infinity : Infinity;
          if (typeof x === 'string') return s.d * String(x).localeCompare(String(y), 'ja');
          return s.d * (x - y) || String(a.name).localeCompare(String(b.name), 'ja');
        });
      }

      function anDelta(cur, prev, unit, invert) {
        if (cur == null || prev == null) return '';
        var d = Math.round((cur - prev) * 10) / 10;
        if (!d) return '<span class="an-delta flat">±0' + unit + '</span>';
        var good = invert ? d < 0 : d > 0;
        return '<span class="an-delta ' + (good ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + d + unit + '</span>';
      }

      function anKpi(label, value, suffix, sub, delta, hero) {
        return '<div class="an-kpi' + (hero ? ' hero' : '') + '"><span class="k">' + esc(label) + '</span>' +
          '<span class="v">' + value + (suffix ? '<small>' + suffix + '</small>' : '') + (delta || '') + '</span>' +
          '<span class="s">' + (sub || '&nbsp;') + '</span></div>';
      }

      function anTrendSvg() {
        var by = anUnitsByTask();
        var months = {};
        AN.data.tasks.forEach(function (t, ti) {
          if (AN.kind !== 'all' && t.k !== AN.kind) return;
          var k = anKeyOf('month', new Date(t.c));
          var m = months[k] || (months[k] = { employee: 0, store: 0, tf: 0, n: 0, units: 0, done: 0, onTime: 0 });
          m[t.k]++; m.n++;
          by[ti].forEach(function (u) { if (anUnitOk(u, t)) { m.units++; m.done += u[3]; m.onTime += u[4]; } });
        });
        var keys = Object.keys(months).sort();
        if (!keys.length) return '<div class="an-empty">データがありません</div>';
        var first = keys[0].split('-').map(Number), last = anKeyOf('month', new Date()).split('-').map(Number);
        var lk = keys[keys.length - 1].split('-').map(Number);
        if (lk[0] * 12 + lk[1] > last[0] * 12 + last[1]) last = lk;
        var all = [];
        for (var y = first[0], mo = first[1]; y * 12 + mo <= last[0] * 12 + last[1]; mo++) {
          if (mo > 12) { mo = 1; y++; }
          all.push(y + '-' + anPad(mo));
          if (all.length > 36) break;
        }
        if (all.length > 12) all = all.slice(all.length - 12);
        return '<div class="an-trend">' +
          '<div class="an-trend-pane"><h4>依頼数</h4>' + anCountSvg(all, months) +
          '<div class="an-legend"><span><i style="background:' + AN_KIND.employee.color + '"></i>社員依頼</span><span><i style="background:' + AN_KIND.store.color + '"></i>店舗依頼</span><span><i style="background:' + AN_KIND.tf.color + '"></i>TF依頼</span></div></div>' +
          '<div class="an-trend-pane"><h4>実施率</h4>' + anRateSvg(all, months) +
          '<div class="an-legend"><span><i style="background:#0f172a;height:3px;vertical-align:3px"></i>実施率（完了した割合）</span><span><i style="background:#94a3b8;height:3px;vertical-align:3px"></i>期限内に完了した割合</span></div></div>' +
          '</div>';
      }

      function anMonthSelected(k) {
        return AN.unit !== 'all' && anKeyOf(AN.unit, new Date(Number(k.split('-')[0]), Number(k.split('-')[1]) - 1, 15)) === AN.key;
      }

      function anMonthAxis(all, i, x, y) {
        var p = all[i].split('-');
        var sel = anMonthSelected(all[i]);
        var s = '<text x="' + x + '" y="' + y + '" font-size="12" fill="' + (sel ? '#0f172a' : '#64748b') + '" font-weight="' + (sel ? 800 : 600) + '" text-anchor="middle">' + Number(p[1]) + '月</text>';
        if (i === 0 || p[1] === '01') s += '<text x="' + x + '" y="' + (y + 14) + '" font-size="10" fill="#94a3b8" text-anchor="middle">' + p[0] + '年</text>';
        return s;
      }

      function anCountSvg(all, months) {
        var W = 480, H = 240, L = 12, R = 12, T = 26, B = 40;
        var max = 1;
        all.forEach(function (k) { if (months[k] && months[k].n > max) max = months[k].n; });
        var cw = (W - L - R) / all.length, bw = Math.min(44, cw * .6);
        var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="月別の依頼数">';
        s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="#e2e8f0"/>';
        all.forEach(function (k, i) {
          var m = months[k] || { employee: 0, store: 0, tf: 0, n: 0 };
          var cx = L + cw * i + cw / 2, x = cx - bw / 2, yb = H - B;
          if (anMonthSelected(k)) s += '<rect x="' + (L + cw * i + 2) + '" y="4" width="' + (cw - 4) + '" height="' + (H - 8) + '" rx="8" fill="#f1f5f9"/>';
          ['employee', 'store', 'tf'].forEach(function (kk) {
            if (!m[kk]) return;
            var h = (H - T - B) * m[kk] / max;
            yb -= h;
            s += '<rect x="' + x + '" y="' + yb + '" width="' + bw + '" height="' + h + '" fill="' + AN_KIND[kk].color + '"><title>' + k + ' ' + AN_KIND[kk].label + ' ' + m[kk] + '件</title></rect>';
          });
          if (m.n) s += '<text x="' + cx + '" y="' + (yb - 7) + '" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">' + m.n + '件</text>';
          s += anMonthAxis(all, i, cx, H - B + 17);
        });
        return s + '</svg>';
      }

      function anRateSvg(all, months) {
        var W = 480, H = 240, L = 36, R = 16, T = 24, B = 40;
        var cw = (W - L - R) / all.length;
        var yOf = function (pct) { return T + (H - T - B) * (1 - pct / 100); };
        var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="月別の実施率">';
        [0, 50, 100].forEach(function (g) {
          s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yOf(g) + '" y2="' + yOf(g) + '" stroke="' + (g ? '#f1f5f9' : '#e2e8f0') + '"/>';
          s += '<text x="' + (L - 6) + '" y="' + (yOf(g) + 4) + '" font-size="10" fill="#94a3b8" text-anchor="end">' + g + '%</text>';
        });
        var done = [], onTime = [];
        all.forEach(function (k, i) {
          var m = months[k];
          var cx = L + cw * i + cw / 2;
          if (anMonthSelected(k)) s += '<rect x="' + (L + cw * i + 2) + '" y="4" width="' + (cw - 4) + '" height="' + (H - 8) + '" rx="8" fill="#f1f5f9"/>';
          if (m && m.units) {
            done.push([cx, Math.round(m.done / m.units * 100)]);
            onTime.push([cx, Math.round(m.onTime / m.units * 100)]);
          }
          s += anMonthAxis(all, i, cx, H - B + 17);
        });
        var line = function (pts, color, width) {
          if (pts.length > 1) s += '<polyline fill="none" stroke="' + color + '" stroke-width="' + width + '" stroke-linejoin="round" points="' + pts.map(function (p) { return p[0] + ',' + yOf(p[1]); }).join(' ') + '"/>';
        };
        line(onTime, '#94a3b8', 2);
        line(done, '#0f172a', 2.5);
        onTime.forEach(function (p, i) {
          var below = p[1] <= done[i][1] && p[1] > 12;
          s += '<circle cx="' + p[0] + '" cy="' + yOf(p[1]) + '" r="3.5" fill="#fff" stroke="#94a3b8" stroke-width="2"/>';
          s += '<text x="' + p[0] + '" y="' + (yOf(p[1]) + (below ? 16 : -9)) + '" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">' + p[1] + '%</text>';
        });
        done.forEach(function (p, i) {
          var above = p[1] >= onTime[i][1];
          s += '<circle cx="' + p[0] + '" cy="' + yOf(p[1]) + '" r="4" fill="#0f172a"/>';
          s += '<text x="' + p[0] + '" y="' + (yOf(p[1]) + (above ? -10 : 17)) + '" font-size="12.5" font-weight="800" fill="#0f172a" text-anchor="middle">' + p[1] + '%</text>';
        });
        return s + '</svg>';
      }

      function anSortTh(table, key, label, num) {
        var s = table === 'req' ? AN.reqSort : AN.execSort;
        var on = s.k === key;
        return '<th class="' + (num ? 'num ' : '') + (on ? 'on' : '') + '" data-an-sort="' + table + ':' + key + '">' + label + (on ? (s.d < 0 ? ' ▼' : ' ▲') : '') + '</th>';
      }

      function anBarCell(v, max, text) {
        var w = max ? Math.max(2, Math.round(v / max * 100)) : 0;
        return '<div class="an-barcell"><div class="an-bar"><span style="width:' + w + '%"></span></div><strong>' + text + '</strong></div>';
      }

      function anRequesterTable(rows) {
        if (!rows.length) return '<div class="an-empty">この期間の依頼はありません</div>';
        var sorted = anSortRows(rows, AN.reqSort);
        var max = 0; rows.forEach(function (r) { if (r.tasks > max) max = r.tasks; });
        var show = AN.reqAll ? sorted : sorted.slice(0, 10);
        var h = '<div class="an-tablewrap"><table class="an-table"><thead><tr><th class="rk">#</th>' +
          anSortTh('req', 'name', '依頼者') + anSortTh('req', 'tasks', '依頼数') + anSortTh('req', 'units', '対象（延べ）', true) +
          anSortTh('req', 'rate', '実施率', true) + anSortTh('req', 'onTimeRate', '期限内', true) + anSortTh('req', 'med', '完了まで（中央値）', true) +
          '</tr></thead><tbody>';
        show.forEach(function (r, i) {
          var mix = ['employee', 'store', 'tf'].filter(function (k) { return r[k]; }).map(function (k) { return AN_KIND[k].label + r[k]; }).join(' / ');
          h += '<tr><td class="rk">' + (i + 1) + '</td><td><div class="nm">' + esc(r.name) + '</div><div class="sub">' + esc([r.team && r.team + 'チーム', r.role].filter(Boolean).join('・') || '—') + '</div></td>' +
            '<td>' + anBarCell(r.tasks, max, r.tasks + '件') + '<div class="sub">' + esc(mix) + '</div></td>' +
            '<td class="num">' + r.units + '</td><td class="num">' + anPill(r.rate) + '</td><td class="num">' + anPill(r.onTimeRate) + '</td>' +
            '<td class="num">' + anHours(r.med) + '</td></tr>';
        });
        h += '</tbody></table></div>';
        if (sorted.length > 10) h += '<button type="button" class="an-more" data-an-more="req">' + (AN.reqAll ? '上位10件に戻す' : 'すべて表示（' + sorted.length + '名）') + '</button>';
        return h;
      }

      function anExecutorTable(rows) {
        var q = AN.execQuery.trim();
        var list = rows.filter(function (r) {
          if (AN.execRole && r.role !== AN.execRole) return false;
          if (q && (r.name + ' ' + r.team + ' ' + r.area).indexOf(q) < 0) return false;
          return true;
        });
        if (!list.length) return '<div class="an-empty">該当する実施者はいません</div>';
        var sorted = anSortRows(list, AN.execSort);
        var max = 0; list.forEach(function (r) { if (r.handled > max) max = r.handled; });
        var show = AN.execAll ? sorted : sorted.slice(0, 15);
        var h = '<div class="an-tablewrap"><table class="an-table"><thead><tr><th class="rk">#</th>' +
          anSortTh('exec', 'name', '実施者') + anSortTh('exec', 'handled', '対応件数') + anSortTh('exec', 'targets', '依頼された', true) +
          anSortTh('exec', 'pending', '未実施', true) + anSortTh('exec', 'rate', '実施率', true) + anSortTh('exec', 'onTimeRate', '期限内', true) +
          anSortTh('exec', 'storeOps', '店舗分の完了', true) + anSortTh('exec', 'med', '完了まで（中央値）', true) + '</tr></thead><tbody>';
        show.forEach(function (r, i) {
          h += '<tr><td class="rk">' + (i + 1) + '</td><td><div class="nm">' + esc(r.name) + (r.reg ? '' : ' <span class="sub">（未登録）</span>') + '</div><div class="sub">' +
            esc([r.role, r.area].filter(Boolean).join('・') || '—') + '</div></td>' +
            '<td>' + anBarCell(r.handled, max, r.handled + '件') + '</td>' +
            '<td class="num">' + r.targets + '</td><td class="num">' + (r.pending ? '<strong style="color:#0f172a">' + r.pending + '</strong>' : '0') + '</td>' +
            '<td class="num">' + anPill(r.rate) + '</td><td class="num">' + anPill(r.onTimeRate) + '</td>' +
            '<td class="num">' + r.storeOps + '</td><td class="num">' + anHours(r.med) + '</td></tr>';
        });
        h += '</tbody></table></div>';
        if (sorted.length > 15) h += '<button type="button" class="an-more" data-an-more="exec">' + (AN.execAll ? '上位15件に戻す' : 'すべて表示（' + sorted.length + '名）') + '</button>';
        return h;
      }

      function anHBars(items, colorFn) {
        if (!items.length) return '<div class="an-empty">データがありません</div>';
        var max = 0; items.forEach(function (x) { if (x.v > max) max = x.v; });
        return '<div class="an-hbars">' + items.map(function (x) {
          var w = max ? Math.max(2, Math.round(x.v / max * 100)) : 0;
          return '<div class="an-hbar"><span class="nm" title="' + esc(x.name) + '">' + esc(x.name) + '</span>' +
            '<div class="an-bar" style="height:.65rem"><span style="width:' + w + '%;background:' + (colorFn ? colorFn(x) : 'var(--acc-500)') + '"></span></div>' +
            '<span class="val">' + x.text + '</span></div>';
        }).join('') + '</div>';
      }

      function anRateColor(x) { return x.rate == null ? '#e2e8f0' : 'var(--acc-600)'; }

      function renderAnalytics(root) {
        if (!AN.data) { root.innerHTML = '<div class="loading">分析データを集計中…</div>'; return; }
        if (AN.unit !== 'all') {
          var ks = anKeys(AN.unit);
          if (ks.indexOf(AN.key) < 0) AN.key = anKeyOf(AN.unit, new Date());
        } else AN.key = 'all';
        var tis = anSelectTasks(AN.unit, AN.key);
        var A = anAggregate(tis);
        var pk = anPrevKey(AN.unit, AN.key);
        var P = pk ? anAggregate(anSelectTasks(AN.unit, pk)) : null;
        var reqRows = anRequesterRows(tis);
        var execRows = anExecutorRows(tis);
        var periodLabel = anLabel(AN.unit, AN.key);
        var prevLabel = pk ? '前期間（' + anLabel(AN.unit, pk) + '）比' : '';

        var h = '<div class="an">';

        // ツールバー
        var keys = anKeys(AN.unit), ki = keys.indexOf(AN.key);
        h += '<div class="an-card an-toolbar">';
        h += '<div class="an-row"><span class="an-label">集計期間</span><div class="an-seg">' +
          [['month', '月'], ['half', '上期・下期'], ['fy', '年度'], ['all', '全期間']].map(function (o) {
            return '<button type="button" data-an-unit="' + o[0] + '" class="' + (AN.unit === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
          }).join('') + '</div>';
        if (AN.unit !== 'all') {
          h += '<div class="an-period"><button type="button" class="nav" data-an-step="-1"' + (ki <= 0 ? ' disabled' : '') + ' aria-label="前へ">‹</button>' +
            '<select id="anKeySel">' + keys.slice().reverse().map(function (k) {
              return '<option value="' + k + '"' + (k === AN.key ? ' selected' : '') + '>' + anLabel(AN.unit, k) + '</option>';
            }).join('') + '</select>' +
            '<button type="button" class="nav" data-an-step="1"' + (ki >= keys.length - 1 ? ' disabled' : '') + ' aria-label="次へ">›</button></div>';
        }
        h += '</div>';
        h += '<div class="an-row"><span class="an-label">依頼の種類</span><div class="an-seg">' +
          [['all', 'すべて'], ['employee', '社員'], ['store', '店舗'], ['tf', 'TF']].map(function (o) {
            return '<button type="button" data-an-kind="' + o[0] + '" class="' + (AN.kind === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
          }).join('') + '</div>' +
          '<label class="an-toggle"><input type="checkbox" id="anExcl"' + (AN.excl ? ' checked' : '') + '/>' +
          esc((AN.data.excludeRoles || []).join('・')) + ' を実施率の集計から除く</label></div>';
        h += '</div>';

        // KPI
        var avgPerReq = A.requesterCount ? Math.round(A.tasks / A.requesterCount * 10) / 10 : null;
        h += '<div class="an-kpis">';
        h += anKpi('実施率（' + periodLabel + '）', anPctText(A.rate), '', A.done + ' / ' + A.units + ' 件完了' + (prevLabel ? '・' + esc(prevLabel) : ''), P ? anDelta(A.rate, P.rate, 'pt') : '', true);
        h += anKpi('依頼数', A.tasks, '件', '社員' + A.kinds.employee + ' / 店舗' + A.kinds.store + ' / TF' + A.kinds.tf, P ? anDelta(A.tasks, P.tasks, '件') : '');
        h += anKpi('対象（延べ）', A.units, '件', '1依頼あたり ' + (A.tasks ? Math.round(A.units / A.tasks) : 0) + '件', P ? anDelta(A.units, P.units, '件') : '');
        h += anKpi('期限内に完了', anPctText(A.onTimeRate), '', A.onTime + '件が期限内', P ? anDelta(A.onTimeRate, P.onTimeRate, 'pt') : '');
        h += anKpi('期限超過で未実施', A.overdueOpen, '件', '期限が過ぎても未完了', P ? anDelta(A.overdueOpen, P.overdueOpen, '件', true) : '');
        h += anKpi('完了までの時間', anHours(A.medianHours), '', '依頼から完了までの中央値', '');
        h += anKpi('依頼した人', A.requesterCount, '名', avgPerReq != null ? '1人あたり ' + avgPerReq + '件' : '', P ? anDelta(A.requesterCount, P.requesterCount, '名') : '');
        h += anKpi('対応した人', A.executorCount, '名', (AN.kind === 'store' ? '店舗依頼で完了操作をした人' : '依頼を受けた人 ' + A.targetPeopleCount + '名'), P ? anDelta(A.executorCount, P.executorCount, '名') : '');
        h += '</div>';

        // 推移
        h += '<div class="an-card an-chart"><h3>月別の推移 <span class="tag">直近12か月</span></h3>' +
          '<p class="an-lead">左は月ごとの依頼数、右はその月の依頼がどれだけ完了したかです。選択中の月は背景がグレーになります。</p>' +
          anTrendSvg() + '</div>';

        // 依頼者目線 vs 実施者目線
        var execPersonal = execRows.filter(function (r) { return r.targets > 0; });
        var execTargets = 0, execDone = 0;
        execPersonal.forEach(function (r) { execTargets += r.targets; execDone += r.done; });
        var fullDone = execPersonal.filter(function (r) { return r.done === r.targets; }).length;
        var reqGood = reqRows.filter(function (r) { return r.rate != null && r.rate >= 90; }).length;
        var reqByPi = {};
        reqRows.forEach(function (r) { if (r.pi >= 0) reqByPi[r.pi] = r; });
        var both = execRows.filter(function (r) { return reqByPi[r.pi]; }).length;
        h += '<div class="an-card"><h3>依頼者目線と実施者目線の比較</h3>' +
          '<p class="an-lead">同じ期間を「依頼を出した側」と「依頼を受けて対応した側」の両方から見た数字です。</p><div class="an-vs">';
        h += '<div class="an-side"><h4><span class="dot" style="background:var(--acc-500)"></span>依頼者目線（依頼した側）</h4><dl>' +
          '<dt>依頼した人</dt><dd>' + A.requesterCount + '名</dd>' +
          '<dt>依頼数</dt><dd>' + A.tasks + '件</dd>' +
          '<dt>1人あたりの依頼数</dt><dd>' + (avgPerReq != null ? avgPerReq + '件' : '—') + '</dd>' +
          '<dt>1依頼あたりの対象</dt><dd>' + (A.tasks ? Math.round(A.units / A.tasks * 10) / 10 : '—') + '件</dd>' +
          '<dt>出した依頼の実施率</dt><dd>' + anPill(A.rate) + '</dd>' +
          '<dt>実施率90%以上の依頼者</dt><dd>' + reqGood + ' / ' + reqRows.length + '名</dd></dl></div>';
        h += '<div class="an-side"><h4><span class="dot" style="background:var(--acc-300)"></span>実施者目線（対応した側）</h4><dl>' +
          '<dt>依頼を受けた人</dt><dd>' + execPersonal.length + '名</dd>' +
          '<dt>対応した人（店舗分を含む）</dt><dd>' + A.executorCount + '名</dd>' +
          '<dt>1人あたりの依頼された数</dt><dd>' + (execPersonal.length ? Math.round(execTargets / execPersonal.length * 10) / 10 : '—') + '件</dd>' +
          '<dt>個人あての実施率</dt><dd>' + anPill(anPct(execDone, execTargets)) + '</dd>' +
          '<dt>全件完了した人</dt><dd>' + fullDone + ' / ' + execPersonal.length + '名</dd>' +
          '<dt>依頼も対応もした人</dt><dd>' + both + '名</dd></dl></div>';
        h += '</div></div>';

        // ランキング
        h += '<div class="an-card"><h3>依頼者ランキング <span class="tag">' + esc(periodLabel) + '</span></h3>' +
          '<p class="an-lead">誰がどれだけ依頼したか、その依頼がどれだけ実施されたか。列名をクリックで並び替えできます。</p>' +
          '<div id="anReqWrap">' + anRequesterTable(reqRows) + '</div></div>';

        var roles = {};
        execRows.forEach(function (r) { if (r.role) roles[r.role] = 1; });
        h += '<div class="an-card"><h3>実施者ランキング <span class="tag">' + esc(periodLabel) + '</span></h3>' +
          '<p class="an-lead">誰がどれだけ対応したか。「対応件数」＝自分あての依頼の完了数＋店舗依頼で自分が完了操作した数。実施率・期限内は自分あての依頼で計算しています。</p>' +
          '<div class="an-row" style="margin-bottom:.6rem"><input type="search" class="an-search" id="anExecQ" placeholder="名前・エリアで検索" value="' + esc(AN.execQuery) + '"/>' +
          '<select class="an-search" id="anExecRole" style="min-width:8rem"><option value="">役職：すべて</option>' +
          Object.keys(roles).sort().map(function (r) { return '<option' + (AN.execRole === r ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') + '</select></div>' +
          '<div id="anExecWrap">' + anExecutorTable(execRows) + '</div></div>';

        // チーム・エリア
        var teamMap = {};
        reqRows.forEach(function (r) {
          (anSplit(r.team).length ? anSplit(r.team) : ['チーム未設定']).forEach(function (t) {
            var x = teamMap[t] || (teamMap[t] = { name: t, v: 0, units: 0, done: 0 });
            x.v += r.tasks; x.units += r.units; x.done += r.done;
          });
        });
        var teamItems = Object.keys(teamMap).map(function (k) { var x = teamMap[k]; x.rate = anPct(x.done, x.units); x.text = x.v + '件 <span>' + anPctText(x.rate) + '</span>'; return x; })
          .sort(function (a, b) { return b.v - a.v; });
        var areaMap = {};
        execPersonal.forEach(function (r) {
          (anSplit(r.area).length ? anSplit(r.area) : ['エリア未設定']).forEach(function (a) {
            var x = areaMap[a] || (areaMap[a] = { name: a, targets: 0, done: 0 });
            x.targets += r.targets; x.done += r.done;
          });
        });
        var areaItems = Object.keys(areaMap).map(function (k) { var x = areaMap[k]; x.rate = anPct(x.done, x.targets); x.v = x.rate || 0; x.text = anPctText(x.rate) + ' <span>' + x.done + '/' + x.targets + '</span>'; return x; })
          .sort(function (a, b) { return b.v - a.v; });
        h += '<div class="an-grid2">';
        h += '<div class="an-card"><h3>TFチーム別の依頼数</h3><p class="an-lead">依頼者の所属チームごとの依頼数。右の%はその依頼の実施率です（色：緑90%以上／黄70%以上／赤70%未満）。</p>' + anHBars(teamItems, anRateColor) + '</div>';
        h += '<div class="an-card"><h3>エリア別の実施率</h3><p class="an-lead">依頼を受けた人の現在のエリアごとの実施率（完了/依頼された数）。</p>' + anHBars(areaItems, anRateColor) + '</div>';
        h += '</div>';

        // 実施率が低い依頼
        var low = A.perTask.filter(function (x) { return x.pastDue && x.total > 0 && x.done < x.total; })
          .sort(function (a, b) { return a.done / a.total - b.done / b.total; }).slice(0, 8);
        h += '<div class="an-card"><h3>期限を過ぎて未完了が残っている依頼</h3><p class="an-lead">実施率が低い順に最大8件。フォローが必要な依頼の目安です。</p>';
        if (!low.length) h += '<div class="an-empty">該当する依頼はありません</div>';
        else {
          h += '<div class="an-tablewrap"><table class="an-table"><thead><tr><th>期限</th><th>種類</th><th>依頼者</th><th>内容</th><th class="num">未実施</th><th class="num">実施率</th></tr></thead><tbody>';
          low.forEach(function (x) {
            var t = AN.data.tasks[x.ti];
            h += '<tr><td style="white-space:nowrap">' + esc(t.d || '—') + '</td><td>' + esc(AN_KIND[t.k] ? AN_KIND[t.k].label : t.k) + '</td><td class="nm">' + esc(t.s) + '</td>' +
              '<td><div style="max-width:28rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(t.ct || '—') + '</div><div class="sub">' + esc(t.tg || '') + '</div></td>' +
              '<td class="num"><strong style="color:#0f172a">' + (x.total - x.done) + '</strong></td><td class="num">' + anPill(anPct(x.done, x.total)) + '</td></tr>';
          });
          h += '</tbody></table></div>';
        }
        h += '</div>';

        h += '<p class="an-note">※ 期間は「依頼の投稿日」で区切っています。上期＝4〜9月、下期＝10〜翌3月。期限前の依頼も含むため、直近の期間は実施率が低めに出ます。人の役職・チーム・エリアは現在の従業員データの値です。最終集計: ' +
          esc(new Date(AN.data.generatedAt).toLocaleString('ja-JP')) + '</p>';
        h += '</div>';
        root.innerHTML = h;
        bindAnalyticsEvents(root, execRows);
      }

      function bindAnalyticsEvents(root, execRows) {
        root.querySelectorAll('[data-an-unit]').forEach(function (el) {
          el.addEventListener('click', function () {
            AN.unit = el.getAttribute('data-an-unit');
            AN.key = anKeyOf(AN.unit, new Date());
            renderAll();
          });
        });
        root.querySelectorAll('[data-an-kind]').forEach(function (el) {
          el.addEventListener('click', function () { AN.kind = el.getAttribute('data-an-kind'); renderAll(); });
        });
        root.querySelectorAll('[data-an-step]').forEach(function (el) {
          el.addEventListener('click', function () {
            var ks = anKeys(AN.unit), i = ks.indexOf(AN.key) + Number(el.getAttribute('data-an-step'));
            if (i >= 0 && i < ks.length) { AN.key = ks[i]; renderAll(); }
          });
        });
        var sel = document.getElementById('anKeySel');
        if (sel) sel.addEventListener('change', function () { AN.key = sel.value; renderAll(); });
        var ex = document.getElementById('anExcl');
        if (ex) ex.addEventListener('change', function () { AN.excl = ex.checked; renderAll(); });
        if (!AN.boundRoot) {
          AN.boundRoot = true;
          root.addEventListener('click', onAnalyticsRootClick);
        }
        var q = document.getElementById('anExecQ');
        if (q) q.addEventListener('input', function () {
          AN.execQuery = q.value;
          document.getElementById('anExecWrap').innerHTML = anExecutorTable(execRows);
        });
        var role = document.getElementById('anExecRole');
        if (role) role.addEventListener('change', function () {
          AN.execRole = role.value;
          document.getElementById('anExecWrap').innerHTML = anExecutorTable(execRows);
        });
      }

      function onAnalyticsRootClick(e) {
          if (mode !== 'analytics' || !e.target.closest) return;
          var th = e.target.closest('[data-an-sort]');
          if (th) {
            var p = th.getAttribute('data-an-sort').split(':');
            var s = p[0] === 'req' ? AN.reqSort : AN.execSort;
            if (s.k === p[1]) s.d = -s.d; else { s.k = p[1]; s.d = p[1] === 'name' ? 1 : -1; }
            renderAll();
            return;
          }
          var more = e.target.closest('[data-an-more]');
          if (more) {
            if (more.getAttribute('data-an-more') === 'req') AN.reqAll = !AN.reqAll; else AN.execAll = !AN.execAll;
            renderAll();
          }
      }

      function renderRoot() {
        var root = document.getElementById('root');
        if (mode === 'analytics') {
          renderAnalytics(root);
        } else if (mode === 'reminderEffect') {
          root.innerHTML = renderReminderEffects();
          bindPersonFilterEvents();
        } else {
          root.innerHTML = renderTaskList();
          bindTaskEvents();
        }
      }

      function openCount(list) {
        return (list || []).filter(function (t) { return !t.complete; }).length;
      }

      function renderModeBadges() {
        /* 件数バッジはトップ集計に集約したため非表示 */
      }

      function renderAll() {
        document.querySelectorAll('.mode-nav-tile[data-mode]').forEach(function (c) {
          var on = c.getAttribute('data-mode') === mode;
          c.classList.toggle('on', on);
          c.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        if (mode === 'reminderEffect' && !reminderEffectsLoaded) {
          ensureReminderEffects(function () { renderAll(); });
          return;
        }
        if (mode === 'analytics' && !AN.data) {
          document.getElementById('statsBar').style.display = 'none';
          renderFilters();
          ensureAnalytics();
          return;
        }
        renderModeBadges();
        renderStats();
        renderFilters();
        ensureDefaultOpenTask();
        renderRoot();
      }

      function showError(msg) {
        document.getElementById('root').innerHTML = '<div class="err">' + esc(msg) + '</div>';
      }

      function setMenuOpen(open) {
        document.getElementById('accountMenu').classList.toggle('open', open);
        document.getElementById('menuBackdrop').classList.toggle('open', open);
      }

      function applyData(data) {
        if (!data.ok) {
          showError(data.message || '読み込みに失敗しました');
          return;
        }
        lastData = data;
        reminderEffectsLoaded = false;
        if (!data.reminderEffects) lastData.reminderEffects = emptyReminderEffectsPack();
        pendingAutoOpen = true;
        var email = data.viewerEmail || '';
        document.getElementById('metaLine').textContent =
          '最終更新: ' + (data.generatedAt ? new Date(data.generatedAt).toLocaleString('ja-JP') : '—');
        var displayWho = (data.viewerName && data.viewerName.trim()) ? data.viewerName : (email ? email.split('@')[0] : '管理者');
        if (data.viewerTeam) displayWho += '（' + data.viewerTeam + ' チーム）';
        document.getElementById('menuWho').textContent = displayWho;
        document.getElementById('menuMail').textContent = email;
        document.getElementById('btnAccount').textContent = accountInitial(email);

        if (data.spreadsheetUrl) {
          var a = document.getElementById('linkSheet');
          a.href = data.spreadsheetUrl;
          a.style.display = 'flex';
        }
        var app = document.getElementById('linkApp');
        app.href = data.appUrl || window.location.href.split('?')[0];

        renderAll();
      }

      function load() {
        reminderEffectsLoaded = false;
        AN.data = null;
        document.getElementById('root').innerHTML = '<div class="loading">読み込み中…</div>';
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          showError('Google Apps Script の Web アプリとして開いてください。');
          return;
        }
        if (mode === 'analytics') ensureAnalytics();
        google.script.run.withSuccessHandler(applyData).withFailureHandler(function (e) {
          showError(e && e.message ? e.message : String(e));
        }).getAdminDashboardData();
      }

      document.querySelectorAll('.mode-nav-tile[data-mode]').forEach(function (tab) {
        tab.addEventListener('click', function () {
          mode = tab.getAttribute('data-mode') || 'analytics';
          pendingAutoOpen = true;
          filter = 'all';
          typeFilter = 'all';
          sortOrder = 'desc';
          renderAll();
        });
      });

      document.getElementById('btnRefresh').addEventListener('click', function () {
        setMenuOpen(false);
        load();
      });

      document.getElementById('btnAccount').addEventListener('click', function (e) {
        e.stopPropagation();
        var menu = document.getElementById('accountMenu');
        setMenuOpen(!menu.classList.contains('open'));
      });
      document.getElementById('menuBackdrop').addEventListener('click', function () { setMenuOpen(false); });

      var grid = document.getElementById('accentGrid');
      ACCENT_THEMES.forEach(function (t) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'accent-swatch';
        b.setAttribute('data-id', t.id);
        b.title = t.label;
        b.style.background = t['500'];
        b.addEventListener('click', function () { applyAccent(t.id); });
        grid.appendChild(b);
      });
      applyAccent(readAccent());
      load();
    })();
  </script>
</body>
</html>
