<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理ダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* タイポグラフィ（index の appText と同階層） */
      --tm-title: 1rem;
      --tm-section: 0.875rem;
      --tm-body: 0.875rem;
      --tm-meta: 0.75rem;
      --tm-badge: 0.6875rem;
      --acc-50: oklch(96.2% 0.018 272.314);
      --acc-100: oklch(93% 0.034 272.788);
      --acc-200: oklch(87% 0.065 274.039);
      --acc-300: oklch(78.5% 0.115 274.713);
      --acc-400: oklch(67.3% 0.182 276.935);
      --acc-500: oklch(58.5% 0.233 277.117);
      --acc-600: oklch(51.1% 0.262 276.966);
      --acc-700: oklch(45.7% 0.24 277.023);
      --acc-900: oklch(35.9% 0.144 278.697);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #f2f2f7;
      font-family: 'Noto Sans JP', system-ui, sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .shell {
      display: flex; flex-direction: column; min-height: 100dvh;
      max-width: 32rem; margin: 0 auto; width: 100%;
    }
    @media (min-width: 768px) {
      .shell { max-width: none; }
    }

    /* --- header（利用者アプリと同型） --- */
    .topbar {
      position: sticky; top: 0; z-index: 40; flex-shrink: 0;
      height: 3.5rem;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,.06);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1rem;
    }
    @media (min-width: 768px) { .topbar { height: 4rem; padding: 0 2rem; } }
    .brand-wrap { display: flex; align-items: center; gap: .75rem; min-width: 0; flex: 1; }
    .brand-mark {
      width: 2.25rem; height: 2.25rem; border-radius: 10px;
      background: var(--acc-500); color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,.06); flex-shrink: 0;
    }
    .brand-mark svg { width: 1.1rem; height: 1.1rem; stroke-width: 3; }
    .brand-col { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .brand-col .sub {
      font-size: 7px; font-weight: 600; letter-spacing: .18em;
      color: #64748b; text-transform: uppercase;
    }
    @media (min-width: 640px) { .brand-col .sub { font-size: 8px; } }
    .brand-col h1 {
      margin: 0; font-size: 1rem; font-weight: 700;
      letter-spacing: -.02em; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    @media (min-width: 640px) { .brand-col h1 { font-size: 1.125rem; } }
    .brand-col h1.sm-only { display: block; }
    @media (min-width: 640px) {
      .brand-col { display: flex; }
      .brand-col h1.sm-only { display: none; }
    }
    .page-title {
      font-size: .875rem; font-weight: 600; color: #64748b;
      letter-spacing: -.01em; margin-left: .25rem; white-space: nowrap;
    }
    @media (max-width: 639px) { .page-title { display: none; } }

    .account-wrap { position: relative; flex-shrink: 0; }
    .account-btn {
      width: 2.25rem; height: 2.25rem; border-radius: 9999px; border: none; cursor: pointer;
      background: linear-gradient(to bottom right, var(--acc-500), var(--acc-700));
      color: #fff; font-size: .875rem; font-weight: 700;
      box-shadow: 0 0 0 2px #fff, 0 4px 14px -4px var(--acc-500);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s;
    }
    .account-btn:active { transform: scale(.95); }
    .menu-backdrop {
      display: none; position: fixed; inset: 0; z-index: 45;
      background: rgba(0,0,0,.2); backdrop-filter: blur(2px);
    }
    .menu-backdrop.open { display: block; }
    .account-menu {
      display: none; position: absolute; right: 0; top: calc(100% + .5rem);
      width: min(18rem, 92vw); max-height: min(88vh, 36rem);
      background: rgba(255,255,255,.95); backdrop-filter: blur(16px);
      border-radius: 1rem; border: 1px solid rgba(0,0,0,.06);
      box-shadow: 0 20px 50px rgba(0,0,0,.15); z-index: 50; overflow: hidden;
      flex-direction: column;
    }
    .account-menu.open { display: flex; }
    .menu-head { padding: 1rem; border-bottom: 1px solid #f1f5f9; }
    .menu-head .who { font-weight: 600; font-size: .9rem; color: #0f172a; word-break: break-all; }
    .menu-head .mail { font-size: 11px; color: #64748b; margin-top: .15rem; word-break: break-all; }
    .menu-meta { padding: .65rem 1rem; font-size: .68rem; color: #64748b; font-weight: 500; border-bottom: 1px solid #f1f5f9; }
    .menu-accent { padding: .75rem 1rem; border-top: 1px solid #e2e8f0; background: linear-gradient(to bottom, #f8fafc, #fff); }
    .menu-accent label {
      display: block; font-size: 9px; font-weight: 800; letter-spacing: .12em;
      text-transform: uppercase; color: var(--acc-600); margin-bottom: .5rem;
    }
    .accent-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .35rem; }
    .accent-swatch {
      height: 2rem; border-radius: .5rem; border: 2px solid #e2e8f0;
      cursor: pointer; padding: 0; transition: all .15s;
    }
    .accent-swatch.on { border-color: #0f172a; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #0f172a; }
    .accent-current { text-align: center; font-size: 10px; font-weight: 700; color: #64748b; margin-top: .5rem; }
    .accent-current span { color: var(--acc-700); }
    .menu-actions { padding: .5rem; border-top: 1px solid #f1f5f9; background: rgba(248,250,252,.8); }
    .menu-link {
      display: flex; align-items: center; gap: .5rem; width: 100%;
      padding: .65rem .75rem; border: none; background: transparent;
      border-radius: .75rem; font-size: .8rem; font-weight: 600; color: #334155;
      cursor: pointer; text-decoration: none; text-align: left;
    }
    .menu-link:hover { background: #f1f5f9; }

    /* --- main --- */
    .main { flex: 1; overflow: auto; padding: 1rem .25rem 6rem; background: #f2f2f7; }
    @media (min-width: 768px) { .main { padding: 1.5rem 1rem 6rem; } }
    .main-inner { max-width: 92rem; margin: 0 auto; width: 100%; padding: 0 .25rem; }
    @media (min-width: 768px) { .main-inner { padding: 0 1rem; } }
    .stack { display: flex; flex-direction: column; gap: 1rem; margin-top: .25rem; width: 100%; }

    /* ステータスバー（トップ画面と同型） */
    .status-strip {
      background: #fff; border-radius: 1rem;
      padding: .75rem 1rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid rgba(0,0,0,.04);
      display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem .9rem;
      font-size: .875rem; color: #475569;
    }
    .status-strip strong { color: #0f172a; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
    .status-strip .sep { color: #cbd5e1; user-select: none; }
    .status-strip .accent strong { color: var(--acc-700); }

    /* モード切替 */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: .5rem;
      width: 100%;
    }
    @media (max-width: 900px) {
      .mode-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .45rem; }
    }
    @media (max-width: 560px) {
      .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem; }
    }
    .mode-nav-tile {
      width: 100%;
      text-align: center;
      background: #fff;
      border-radius: .9rem;
      padding: .85rem .55rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      border: 1px solid rgba(0,0,0,.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s, background .15s;
      min-height: 4.75rem;
    }
    @media (min-width: 900px) {
      .mode-nav-tile { padding: 1rem .75rem; min-height: 5.25rem; border-radius: 1rem; gap: .55rem; }
    }
    .mode-nav-tile:hover {
      border-color: color-mix(in oklch, var(--acc-300) 55%, transparent);
      box-shadow: 0 4px 16px -8px rgba(0,0,0,.12);
    }
    .mode-nav-tile:active { transform: scale(.985); }
    .mode-nav-tile.on {
      background: linear-gradient(180deg, color-mix(in oklch, var(--acc-50) 80%, #fff), #fff);
      border-color: color-mix(in oklch, var(--acc-500) 45%, transparent);
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 0 0 2px color-mix(in oklch, var(--acc-500) 16%, transparent);
    }
    .mode-nav-tile.on .mode-nav-icon {
      background: linear-gradient(to bottom right, var(--acc-500), var(--acc-700));
      color: #fff;
    }
    .mode-nav-icon {
      width: 2.35rem;
      height: 2.35rem;
      border-radius: .7rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--acc-50);
      color: var(--acc-700);
    }
    @media (min-width: 900px) {
      .mode-nav-icon { width: 2.65rem; height: 2.65rem; border-radius: .75rem; }
    }
    .mode-nav-icon svg { width: 1.15rem; height: 1.15rem; }
    .mode-nav-label {
      margin: 0;
      font-size: .78rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
      letter-spacing: .01em;
    }
    @media (min-width: 900px) {
      .mode-nav-label { font-size: .88rem; }
    }

    /* PanelFrame + chip arena（フィルタ用） */
    .panel-frame {
      position: relative; border-radius: 1rem; overflow: hidden;
      border: 1px solid color-mix(in oklch, var(--acc-300) 40%, transparent);
      box-shadow: 0 8px 32px -12px rgba(0,0,0,.1);
    }
    .panel-frame::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to bottom right, color-mix(in oklch, var(--acc-50) 75%, transparent), #fff, #f8fafc);
    }
    .panel-frame::after {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(to bottom, var(--acc-300), var(--acc-500), var(--acc-700));
    }
    .panel-inner { position: relative; padding: 1rem 1rem 1rem 1.35rem; }
    .chip-arena {
      display: flex; flex-direction: column; gap: .65rem;
      border-radius: .75rem;
      border: 1px solid color-mix(in oklch, var(--acc-200) 45%, transparent);
      background: linear-gradient(to bottom, rgba(15,23,42,.03), #fff, color-mix(in oklch, var(--acc-50) 25%, transparent));
      padding: .75rem;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.05);
    }
    .chip-arena .filter-block {
      margin: 0; padding: 0; border: none; background: transparent;
    }
    .chip-arena .filter-block + .filter-block {
      margin-top: 0; padding-top: .55rem;
      border-top: 1px solid #e2e8f0;
    }
    .chip-row {
      display: flex; flex-wrap: wrap; gap: .5rem;
    }
    #filtersPanel { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); background: #fff; }
    #filtersPanel::before, #filtersPanel::after { display: none; }
    #filtersPanel .panel-inner { padding: .85rem 1rem; }
    #filtersPanel .chip-arena { border: none; background: none; box-shadow: none; padding: 0; gap: .5rem; }
    #filtersPanel .filter-block { display: flex; align-items: center; gap: .75rem; }
    #filtersPanel .filter-block + .filter-block { border-top: none; padding-top: 0; }
    #filtersPanel .filter-block .filter-label { margin: 0; min-width: 4.5rem; }
    @media (max-width: 639px) { #filtersPanel .filter-block { flex-direction: column; align-items: flex-start; gap: .35rem; } }
    .chip {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 2.5rem; padding: .5rem .85rem; border-radius: .75rem;
      font-size: var(--tm-body); font-weight: 600; cursor: pointer; border: none;
      background: rgba(255,255,255,.9); color: #334155;
      border: 1px solid color-mix(in oklch, var(--acc-200) 60%, transparent);
      transition: all .15s;
    }
    .chip:hover { border-color: var(--acc-400); background: color-mix(in oklch, var(--acc-50) 60%, white); }
    .chip.on {
      background: linear-gradient(to bottom right, var(--acc-500), var(--acc-700));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px -4px var(--acc-500);
    }
    .badge-type-new { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
    .badge-type-repost { background: var(--acc-50); color: var(--acc-900); border: 1px solid var(--acc-200); }
    .badge-type-remind { background: color-mix(in oklch, var(--acc-100) 70%, #fff); color: var(--acc-900); border: 1px solid var(--acc-200); }

    /* 依頼カード（常時ワンボックス表示） */
    .task-list { display: flex; flex-direction: column; gap: .75rem; }
    .task-card {
      width: 100%; background: #fff;
      border-radius: 1rem; padding: 1.1rem 1.25rem 1.2rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid rgba(0,0,0,.04);
    }
    @media (min-width: 768px) { .task-card { padding: 1.25rem 1.4rem 1.35rem; } }
    .badges { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .55rem; }
    .badge {
      font-size: .65rem; font-weight: 700; padding: .12rem .45rem; border-radius: .4rem;
    }
    .badge-run { background: var(--acc-50); color: var(--acc-900); border: 1px solid var(--acc-200); }
    .badge-ok { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .badge-late { background: var(--acc-50); color: var(--acc-900); border: 1px solid var(--acc-200); }
    .badge-kind-e { background: linear-gradient(to right, var(--acc-600), var(--acc-700)); color: #fff; }
    .badge-kind-s { background: var(--acc-900); color: #fff; }
    .task-metrics {
      display: flex; flex-wrap: wrap; gap: .35rem .85rem;
      margin: 0 0 .55rem; font-size: .92rem; font-weight: 700; color: #334155;
    }
    .task-metrics strong {
      color: var(--acc-700); font-weight: 800; font-variant-numeric: tabular-nums;
    }
    .task-metrics .unit { font-weight: 600; color: #64748b; }
    .task-meta { font-size: var(--tm-meta); color: #64748b; font-weight: 500; margin: 0 0 .75rem; }
    .task-card .detail-body {
      margin: 0 0 .85rem;
      background: color-mix(in oklch, var(--acc-50) 35%, #fff);
      border-color: color-mix(in oklch, var(--acc-200) 55%, transparent);
    }
    .task-card .detail-block { margin: 0 0 .85rem; }
    .task-card .detail-block:last-child { margin-bottom: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .55rem 1rem; font-size: .8rem; font-weight: 600; border-radius: 1rem;
      border: 1px solid rgba(0,0,0,.06); background: #fff; color: #334155;
      cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .btn-primary {
      background: var(--acc-500); color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px -4px var(--acc-500);
    }
    .btn-primary:hover { background: var(--acc-600); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-sm { padding: .4rem .75rem; font-size: .75rem; }

    .detail-label {
      display: block; font-size: .72rem; font-weight: 800; letter-spacing: .04em;
      color: #64748b; margin-bottom: .45rem;
    }
    .detail-body {
      font-size: .95rem; font-weight: 600; color: #0f172a; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
      padding: .85rem 1rem; border-radius: .75rem;
      background: #fff; border: 1px solid #e2e8f0;
    }
    .pending-name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr));
      gap: .45rem .55rem;
    }
    @media (min-width: 900px) {
      .pending-name-grid { grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); }
    }
    .pending-name {
      display: flex; align-items: center; gap: .4rem;
      padding: .55rem .7rem; border-radius: .65rem;
      background: var(--acc-50); border: 1px solid color-mix(in oklch, var(--acc-200) 70%, transparent);
      font-size: .88rem; font-weight: 700; color: #0f172a;
      line-height: 1.35; word-break: break-word;
    }
    .pending-name::before {
      content: ''; width: .45rem; height: .45rem; border-radius: 50%;
      background: var(--acc-500); flex-shrink: 0;
    }
    .pending-empty {
      padding: .75rem .9rem; border-radius: .75rem;
      background: color-mix(in oklch, var(--acc-50) 50%, #fff);
      border: 1px solid color-mix(in oklch, var(--acc-200) 55%, transparent);
      font-size: .88rem; font-weight: 700; color: var(--acc-800, var(--acc-700));
    }
    .done-rank-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
      gap: .45rem .55rem;
    }
    .done-rank {
      display: flex; align-items: center; gap: .55rem;
      padding: .5rem .7rem; border-radius: .65rem;
      background: #f8fafc; border: 1px solid #e2e8f0;
      font-size: .88rem; font-weight: 700; color: #0f172a; line-height: 1.35;
    }
    .done-rank-no {
      flex-shrink: 0; min-width: 1.9rem; height: 1.9rem; padding: 0 .3rem; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--acc-700); color: #fff; font-size: .78rem; font-weight: 800;
    }
    .done-rank-body { min-width: 0; display: flex; flex-direction: column; }
    .done-rank-name { word-break: break-word; }
    .done-rank-time { font-size: .72rem; font-weight: 600; color: #64748b; }
    .pending-toggle { margin-top: .2rem; }
    .pending-toggle > summary {
      display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; list-style: none;
      padding: .5rem .9rem; border-radius: .65rem; border: 1px solid #e2e8f0; background: #fff;
      font-size: .82rem; font-weight: 800; color: #334155;
    }
    .pending-toggle > summary::-webkit-details-marker { display: none; }
    .pending-toggle > summary::after { content: '▼'; font-size: .6rem; color: #94a3b8; }
    .pending-toggle[open] > summary::after { content: '▲'; }
    .pending-toggle[open] > summary { margin-bottom: .6rem; }

    .empty, .loading {
      text-align: center; padding: 3rem 1rem; font-weight: 600; font-size: .9rem; color: #94a3b8;
    }
    .loading { color: var(--acc-600); }
    .err {
      padding: 1.5rem; text-align: center; font-weight: 600; color: var(--acc-800, #334155);
      background: #fff; border-radius: 1rem; border: 1px solid var(--acc-200);
    }

    .intro-block {
      margin: 0 0 .75rem; padding: .65rem .8rem;
      border-radius: .8rem; background: #fff;
      border: 1px solid color-mix(in oklch, var(--acc-200) 50%, transparent);
    }
    .intro-block label {
      display: flex; align-items: center; justify-content: space-between;
      font-size: var(--tm-meta); font-weight: 700; color: var(--acc-700);
      margin-bottom: .35rem;
    }
    .intro-block label .right { display: flex; gap: .35rem; }
    .intro-block textarea {
      width: 100%; min-height: 5.5rem; resize: vertical;
      border: 1px solid #e2e8f0; border-radius: .55rem;
      padding: .55rem .65rem; font-size: .82rem; line-height: 1.55;
      font-family: inherit; color: #0f172a;
      background: #fafafe; outline: none;
    }
    .intro-block textarea:focus { border-color: var(--acc-400); background: #fff; }
    .btn-link {
      background: transparent; border: none; padding: 0;
      font-size: .7rem; font-weight: 700; color: var(--acc-600); cursor: pointer;
    }
    .btn-link:hover { text-decoration: underline; }
    .send-note {
      margin: .75rem 0 0; padding: .6rem .75rem; border-radius: .65rem;
      background: color-mix(in oklch, var(--acc-50) 60%, white);
      border: 1px solid color-mix(in oklch, var(--acc-200) 50%, transparent);
      font-size: .7rem; color: #475569; line-height: 1.5;
    }
    .send-note strong { color: var(--acc-700); }

    /* リマインド効果 */
    .effect-summary {
      background: #fff; border-radius: 1rem;
      padding: 1rem 1.15rem 1.15rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid rgba(0,0,0,.04);
    }
    .effect-summary h3 {
      margin: 0 0 .35rem; font-size: 1rem; font-weight: 800; color: #0f172a;
    }
    .effect-summary .effect-lead {
      margin: 0 0 .9rem; font-size: .78rem; color: #64748b; line-height: 1.5; font-weight: 600;
    }
    .effect-stages {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .55rem;
    }
    @media (max-width: 900px) {
      .effect-stages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

      /* ================= リマインド効果 ================= */
      var RE = { range: '90', show: 'all' };
      var RE_SEG = [
        ['pre', 'リマインド前に完了', '#e2e8f0'],

      function reInRange(t, range) {
        range = range || RE.range;
        if (range === 'all') return true;
        if (range === '90') return t.c >= Date.now() - 90 * 864e5;
        return anKeyOf('half', new Date(t.c)) === anKeyOf('half', new Date());
      }

      /** 1依頼ぶん：各対象がどの回のリマインドの後に完了したか */
      function reTask(ti) {
        var t = AN.data.tasks[ti], rw = t.rw;
        var first = Math.min.apply(null, [rw[0], rw[1], rw[2]].filter(function (x) { return x > 0; }));
        var dlEnd = t.d ? new Date(t.d + 'T23:59:59').getTime() : Infinity;
        var todayStr = (function () { var d = new Date(); return d.getFullYear() + '-' + anPad(d.getMonth() + 1) + '-' + anPad(d.getDate()); })();
        var c = { pre: 0, a2: 0, a1: 0, a0: 0, late: 0, open: 0 }, openNames = [];
        anUnitsByTask()[ti].forEach(function (u) {

          if (!u[3]) {

            var p = AN.data.people[u[1]];

          var at = u[5] != null ? t.c + u[5] * 36e5 : null;
          if (at == null || at < first) c.pre++;
          else if (at > dlEnd) c.late++;
          else if (rw[2] && at >= rw[2]) c.a0++;
          else if (rw[1] && at >= rw[1]) c.a1++;
          else c.a2++;

        var total = c.pre + c.a2 + c.a1 + c.a0 + c.late + c.open;

        var recovered = c.a2 + c.a1 + c.a0;

        var h = '<div class="an">';

          [['90', '直近90日'], ['half', '今の半期'], ['all', '全期間']].map(function (o) {
            return '<button type="button" data-re-range="' + o[0] + '" class="' + (RE.range === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
          }).join('') + '</div>' +
          '<label class="an-toggle"><input type="checkbox" id="anExcl"' + (AN.excl ? ' checked' : '') + '/>' +
          esc((AN.data.excludeRoles || []).join('・')) + ' を集計から除く</label></div></div>';

        if (!list.length) {
          return h + '<div class="an-card"><div class="an-empty">この期間に自動リマインドを送った依頼はありません</div></div></div>';
        }

        h += '<div class="an-card"><h3>リマインドを送った後、どれだけ完了したか</h3>' +
          '<p class="an-lead">期限の2日前・前日・当日の朝に、未実施の人へ自動でリマインドを送っています。1回目のリマインドの時点で未実施だった対象（人・店舗）が、その後いつ完了したかをまとめました。</p>';
        h += '<div class="an-kpis">';
        h += anKpi('期限までに完了', anPctText(anPct(recovered, pending)), '', recovered + ' / ' + pending + ' 件', '', true,
          'リマインドの後、期限の日までに完了 ' + recovered + ' ÷ 1回目のリマインド時点で未実施 ' + pending);
        h += anKpi('リマインド時点で未実施', pending, '件', '全 ' + total + ' 件のうち', '', false,
          '1回目のリマインドを送った時点で、まだ完了していなかった対象の数');
        h += anKpi('期限後に完了', S.late, '件', '遅れて完了', '', false, '期限の日を過ぎてから完了した数');
        h += anKpi('いまも未実施', S.open, '件', openWait ? 'うち期限前 ' + openWait + '件' : '期限が過ぎても未完了', '', false,
          'まだ完了していない数（期限が過ぎたもの ' + openDue + '件・期限前 ' + openWait + '件）');
        h += anKpi('リマインドを送った依頼', list.length, '件', '送信 ' + sends + ' 通', '', false, 'この期間に投稿され、自動リマインドを1回以上送った依頼の数と、送ったメールの通数');
        h += '</div>';
        h += '<div style="margin-top:1rem">' + reBar(S, total, true) + reLegend() + '</div>';
        h += '<div class="re-steps">' + [['a2', '2日前のリマインドの後'], ['a1', '前日のリマインドの後'], ['a0', '当日のリマインドの後']].map(function (s) {
          return '<div class="re-step" data-tip="' + esc(s[1] + '、次のリマインドまで（当日は期限の日の終わりまで）に完了した数') + '"><span class="k">' + s[1] + '</span><span class="v">' + S[s[0]] + '<small>件</small></span>' +
            '<span class="s">未実施だった分の ' + anPctText(anPct(S[s[0]], pending)) + '</span></div>';
        }).join('') + '</div>';
        h += '</div>';

        var counts = { all: list.length, open: 0, done: 0 };
        list.forEach(function (r) { if (r.c.open) counts.open++; else counts.done++; });
        var rows = list.filter(function (r) {
          if (RE.show === 'open') return r.c.open > 0;
          if (RE.show === 'done') return !r.c.open;
          return true;
        }).sort(function (a, b) { return String(b.t.d).localeCompare(String(a.t.d)) || b.t.c - a.t.c; });

        h += '<div class="an-card"><h3>依頼ごとの結果 <span class="tag">期限の新しい順</span></h3>' +
          '<p class="an-lead">帯にカーソルを合わせると件数が出ます。未実施が残っている依頼は「未実施を表示」から名前（店舗名）を確認できます。</p>' +
          '<div class="an-seg" style="margin-bottom:.8rem">' +
          [['all', 'すべて'], ['open', '未実施が残っている'], ['done', 'すべて完了']].map(function (o) {
            return '<button type="button" data-re-show="' + o[0] + '" class="' + (RE.show === o[0] ? 'on' : '') + '">' + o[1] + '（' + counts[o[0]] + '）</button>';
          }).join('') + '</div>';
        if (!rows.length) h += '<div class="an-empty">該当する依頼はありません</div>';
        rows.forEach(function (r) {
          var t = r.t, unit = t.k === 'store' ? '店舗' : '名';
          var sent = [['2日前', t.rw[0]], ['前日', t.rw[1]], ['当日', t.rw[2]]].filter(function (x) { return x[1]; }).map(function (x) { return x[0]; }).join('・');
          h += '<div class="re-task">';
          h += '<div class="re-head"><div class="re-title">[' + esc((AN_KIND[t.k] || {}).label || t.k) + '] ' + esc(t.ct || '（本文なし）') + '</div>' +
            '<div class="re-rate" data-tip="' + esc('期限までに完了 ' + r.recovered + ' ÷ リマインド時点で未実施 ' + r.pending) + '">' + anPill(anPct(r.recovered, r.pending)) + '</div></div>';
          h += '<div class="re-meta">投稿 ' + esc(t.s) + '・DL ' + esc(t.d ? Number(t.d.slice(5, 7)) + '/' + Number(t.d.slice(8, 10)) : '—') + '・送信 ' + esc(sent) + '（' + r.sends + '通）</div>';
          h += reBar(r.c, r.total, false);
          h += '<div class="re-nums">リマインド時点で未実施 <strong>' + r.pending + unit + '</strong> → 期限までに完了 <strong>' + r.recovered + unit + '</strong>' +
            (r.c.late ? '・期限後に完了 <strong>' + r.c.late + unit + '</strong>' : '') +
            (r.c.open ? '・未実施 <strong>' + r.c.open + unit + '</strong>' + (r.pastDue ? '' : '（期限前）') : '') + '</div>';
          if (r.openNames.length) {
            h += '<details class="re-open"><summary>未実施を表示（' + r.openNames.length + unit + '）</summary><div>' +
              r.openNames.map(esc).join('、') + '</div></details>';
          }
          h += '</div>';
        });
        h += '</div></div>';
        return h;
      }

      /* ================= 店舗依頼の分析 ================= */
      var SA = { range: '90', incWait: false, areaView: 'territory', area: '', storeAll: false };

      function saAgg() { return { n: 0, ok: 0, late: 0, ng: 0, wait: 0 }; }
      function saAdd(a, st) { a.n++; a[st]++; }
      function saOnTime(a) { return anPct(a.ok, a.n); }
      function saDone(a) { return anPct(a.ok + a.late, a.n); }

      function saCollect() {
        var by = anUnitsByTask();
        var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var todayStr = today.getFullYear() + '-' + anPad(today.getMonth() + 1) + '-' + anPad(today.getDate());
        var meta = AN.data.storeMeta || {};
        var assignees = {};
        AN.data.people.forEach(function (p, pi) {
          if (!p.reg) return;
          (p.st || []).forEach(function (s) { (assignees[s] = assignees[s] || []).push(pi); });
        });
        var R = { all: saAgg(), areas: {}, terrs: {}, stores: {}, tasks: [], aCnt: {}, load: {}, lead: {}, timing: { d3: 0, d2: 0, d1: 0, d0: 0, late: 0, ng: 0, wait: 0, unk: 0 }, assignees: assignees, taskCount: 0 };
        AN.data.tasks.forEach(function (t, ti) {
          if (t.k !== 'store' || !reInRange(t, SA.range)) return;
          var due = !!(t.d && t.d < todayStr);
          if (!due && !SA.incWait) return;
          var dlEnd = t.d ? new Date(t.d + 'T23:59:59').getTime() : Infinity;
          var created = new Date(t.c); created.setHours(0, 0, 0, 0);
          var leadDays = t.d ? Math.round((new Date(t.d + 'T00:00:00').getTime() - created.getTime()) / 864e5) : null;
          var leadKey = leadDays == null ? 'なし' : leadDays <= 2 ? '〜2日' : leadDays <= 4 ? '3〜4日' : leadDays <= 7 ? '5〜7日' : '8日以上';
          var ta = saAgg();
          by[ti].forEach(function (u) {
            var sn = u[2];
            var m = meta[sn] || ['（店舗データにない）', '—'];
            var st = u[3] ? (u[4] ? 'ok' : 'late') : (due ? 'ng' : 'wait');
            saAdd(R.all, st); saAdd(ta, st);
            saAdd(R.areas[m[0]] = R.areas[m[0]] || saAgg(), st);
            var tk = m[0] + '｜' + m[1];
            saAdd(R.terrs[tk] = R.terrs[tk] || saAgg(), st);
            var sa = R.stores[sn] = R.stores[sn] || Object.assign(saAgg(), { area: m[0], terr: m[1] });
            saAdd(sa, st);
            var asg = assignees[sn] || [];
            var ck = asg.length === 0 ? '0人（未登録）' : asg.length === 1 ? '1人' : asg.length === 2 ? '2人' : '3人以上';
            saAdd(R.aCnt[ck] = R.aCnt[ck] || saAgg(), st);
            asg.forEach(function (pi) {
              var c = (AN.data.people[pi].st || []).length;
              var lk = c <= 3 ? '1〜3店舗' : c <= 9 ? '4〜9店舗' : c <= 19 ? '10〜19店舗' : '20店舗以上';
              var la = R.load[lk] = R.load[lk] || Object.assign(saAgg(), { people: {} });
              saAdd(la, st); la.people[pi] = 1;
            });
            saAdd(R.lead[leadKey] = R.lead[leadKey] || Object.assign(saAgg(), { tasks: {} }), st);
            R.lead[leadKey].tasks[ti] = 1;
            if (!u[3]) R.timing[due ? 'ng' : 'wait']++;
            else if (u[5] == null) R.timing.unk++;
            else {
              var at = t.c + u[5] * 36e5;
              if (at > dlEnd) R.timing.late++;
              else {
                var dd = Math.floor((dlEnd - at) / 864e5);
                R.timing[dd >= 3 ? 'd3' : dd === 2 ? 'd2' : dd === 1 ? 'd1' : 'd0']++;
              }
            }
          });
          if (ta.n) { R.tasks.push({ t: t, a: ta, leadDays: leadDays, due: due }); R.taskCount++; }
        });
        return R;
      }

      /** 0〜100% の絶対値で描く横棒（90% の目標線つき） */
      function saBars(items) {
        if (!items.length) return '<div class="an-empty">データがありません</div>';
        return '<div class="an-hbars">' + items.map(function (x) {
          var v = x.rate == null ? 0 : x.rate;
          return '<div class="an-hbar sa-hbar"' + (x.tip ? ' data-tip="' + esc(x.tip) + '"' : '') + '><span class="nm">' + esc(x.name) + '</span>' +
            '<div class="an-bar sa-bar"><span style="width:' + Math.max(1, v) + '%;background:' + (x.color || 'var(--acc-600)') + '"></span><i class="sa-goal" style="left:90%"></i></div>' +
            '<span class="val">' + (x.rate == null ? '—' : Math.round(x.rate) + '%') + ' <span>' + esc(x.sub || '') + '</span></span></div>';
        }).join('') + '</div>';
      }

      function saAreaSort(a, b) {
        var na = parseInt(String(a).replace(/[^0-9]/g, ''), 10), nb = parseInt(String(b).replace(/[^0-9]/g, ''), 10);
        if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
        return String(a).localeCompare(String(b), 'ja');
      }

      function renderStoreAnalysis() {
        if (!AN.data) return '<div class="loading">店舗依頼を集計中…</div>';
        var R = saCollect(), A = R.all;
        var h = '<div class="an">';
        h += '<div class="an-card an-toolbar"><div class="an-row"><span class="an-label">期間（投稿日）</span><div class="an-seg">' +
          [['90', '直近90日'], ['half', '今の半期'], ['all', '全期間']].map(function (o) {
            return '<button type="button" data-sa-range="' + o[0] + '" class="' + (SA.range === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
          }).join('') + '</div>' +
          '<label class="an-toggle"><input type="checkbox" id="saWait"' + (SA.incWait ? ' checked' : '') + '/>期限前の依頼も含める</label></div>' +
          '<p class="an-lead" style="margin:0">ふだんは<strong>期限が過ぎた店舗依頼だけ</strong>で計算します（期限前の未実施を「遅れ」と数えないため）。店舗のエリア・テリトリー・担当者は、いまの店舗データ・従業員データで判定しています。</p></div>';

        if (!A.n) return h + '<div class="an-card"><div class="an-empty">この期間に期限が過ぎた店舗依頼はありません</div></div></div>';

        var need = Math.max(0, Math.ceil(A.n * 0.9) - A.ok);
        h += '<div class="an-card"><h3>店舗依頼の実施状況</h3><p class="an-lead">「対象」は 依頼 × 店舗 の数です（98店舗あての依頼1件なら98件）。目標は期限内完了90%です。</p><div class="an-kpis">';
        h += anKpi('期限内に完了', anPctText(saOnTime(A)), '', A.ok + ' / ' + A.n + ' 件', '', true, '期限の日までに完了 ' + A.ok + ' ÷ 対象 ' + A.n + '（依頼×店舗）');
        h += anKpi('完了率', anPctText(saDone(A)), '', '期限後の完了も含む', '', false, '完了 ' + (A.ok + A.late) + ' ÷ 対象 ' + A.n);
        h += anKpi('期限超過で未実施', A.ng, '件', '期限が過ぎても未完了', '', false, '期限が過ぎたのに、まだ完了していない 依頼×店舗 の数');
        h += anKpi('期限後に完了', A.late, '件', '遅れて完了', '', false, '期限の日を過ぎてから完了した数');
        h += anKpi('目標90%まで', need, '件', need ? 'あと' + need + '件が期限内なら達成' : '達成しています', '', false, '対象 ' + A.n + ' × 90% ＝ ' + Math.ceil(A.n * 0.9) + '件 − いまの期限内完了 ' + A.ok + '件');
        h += anKpi('店舗依頼', R.taskCount, '件', Object.keys(R.stores).length + '店舗が対象', '', false, 'この期間の店舗依頼の数と、対象になった店舗の数');
        h += '</div></div>';

        // エリア・テリトリー別
        var groups = SA.areaView === 'area' ? R.areas : R.terrs;
        var storeCount = {};
        Object.keys(R.stores).forEach(function (sn) {
          var s = R.stores[sn], k = SA.areaView === 'area' ? s.area : s.area + '｜' + s.terr;
          storeCount[k] = (storeCount[k] || 0) + 1;
        });
        var gkeys = Object.keys(groups).sort(saAreaSort);
        h += '<div class="an-card"><h3>エリア・テリトリー別</h3><p class="an-lead">行を押すと、下の「店舗別」がそのエリアに絞り込まれます。黒い縦線が目標の90%です。</p>' +
          '<div class="an-seg" style="margin-bottom:.7rem">' + [['territory', 'テリトリー別'], ['area', 'エリア別']].map(function (o) {
            return '<button type="button" data-sa-view="' + o[0] + '" class="' + (SA.areaView === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
          }).join('') + '</div>';
        h += '<div class="an-tablewrap"><table class="an-table"><thead><tr><th>' + (SA.areaView === 'area' ? 'エリア' : 'エリア・テリトリー') + '</th><th class="num">店舗</th><th class="num">対象</th><th>期限内に完了</th><th class="num">完了率</th><th class="num">期限超過で未実施</th></tr></thead><tbody>';
        gkeys.forEach(function (k) {
          var g = groups[k], area = k.split('｜')[0];
          var r = saOnTime(g);
          h += '<tr class="sa-row' + (SA.area === area ? ' on' : '') + '" data-sa-area="' + esc(area) + '"><td class="nm">' + esc(k.replace('｜', '・')) + '</td>' +
            '<td class="num">' + (storeCount[k] || 0) + '</td><td class="num">' + g.n + '</td>' +
            '<td><div class="an-barcell"><div class="an-bar sa-bar"><span style="width:' + Math.max(1, r || 0) + '%"></span><i class="sa-goal" style="left:90%"></i></div><strong>' + anPctText(r) + '</strong></div></td>' +
            '<td class="num">' + anPill(saDone(g)) + '</td><td class="num">' + (g.ng ? '<strong>' + g.ng + '</strong>' : '0') + '</td></tr>';
        });
        h += '</tbody></table></div></div>';

        // 店舗別
        var areaOpts = Object.keys(R.areas).sort(saAreaSort);
        var stores = Object.keys(R.stores).map(function (sn) {
          var s = R.stores[sn];
          return { sn: sn, s: s, rate: saOnTime(s), asg: (R.assignees[sn] || []).map(function (pi) { return AN.data.people[pi].n; }) };
        }).filter(function (x) { return !SA.area || x.s.area === SA.area; })
          .sort(function (a, b) { return (a.rate == null ? 999 : a.rate) - (b.rate == null ? 999 : b.rate) || b.s.ng - a.s.ng || a.sn.localeCompare(b.sn, 'ja'); });
        var shown = SA.storeAll ? stores : stores.slice(0, 20);
        h += '<div class="an-card"><h3>店舗別 <span class="tag">期限内完了率の低い順</span></h3>' +
          '<div class="an-row" style="margin:.4rem 0 .7rem"><span class="an-label">エリア</span><select id="saArea" class="an-search" style="min-width:8rem"><option value="">すべて</option>' +
          areaOpts.map(function (a) { return '<option value="' + esc(a) + '"' + (SA.area === a ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('') + '</select></div>';
        h += '<div class="an-tablewrap"><table class="an-table"><thead><tr><th class="rk">#</th><th>店舗</th><th>担当者</th><th class="num">対象</th><th>期限内に完了</th><th class="num">完了率</th><th class="num">期限超過で未実施</th></tr></thead><tbody>';
        shown.forEach(function (x, i) {
          h += '<tr><td class="rk">' + (i + 1) + '</td><td><div class="nm">' + esc(x.sn) + '</div><div class="sub">' + esc(x.s.area + '・' + x.s.terr) + '</div></td>' +
            '<td>' + (x.asg.length ? '<div class="sub" style="color:#334155;font-size:.74rem">' + esc(x.asg.join('、')) + '</div>' : '<span class="ps-st ng">担当者なし</span>') + '</td>' +
            '<td class="num">' + x.s.n + '</td>' +
            '<td><div class="an-barcell"><div class="an-bar sa-bar"><span style="width:' + Math.max(1, x.rate || 0) + '%"></span><i class="sa-goal" style="left:90%"></i></div><strong>' + anPctText(x.rate) + '</strong></div></td>' +
            '<td class="num">' + anPill(saDone(x.s)) + '</td><td class="num">' + (x.s.ng ? '<strong>' + x.s.ng + '</strong>' : '0') + '</td></tr>';
        });
        h += '</tbody></table></div>';
        if (stores.length > 20) h += '<button type="button" class="an-more" data-sa-more="1">' + (SA.storeAll ? '20店舗に戻す' : 'すべて表示（' + stores.length + '店舗）') + '</button>';
        h += '</div>';

        // 原因の手がかり
        var order = function (obj, keys, subFn, tipFn) {
          return keys.filter(function (k) { return obj[k]; }).map(function (k) {
            var g = obj[k];
            return { name: k, rate: saOnTime(g), sub: subFn(g, k), tip: tipFn ? tipFn(g, k) : '' };
          });
        };
        var aCntStores = {};
        Object.keys(R.stores).forEach(function (sn) {
          var c = (R.assignees[sn] || []).length;
          var k = c === 0 ? '0人（未登録）' : c === 1 ? '1人' : c === 2 ? '2人' : '3人以上';
          aCntStores[k] = (aCntStores[k] || 0) + 1;
        });
        var T = R.timing, tTotal = T.d3 + T.d2 + T.d1 + T.d0 + T.late + T.ng + T.wait + T.unk;
        var timingItems = [['d3', '期限の3日以上前'], ['d2', '期限の2日前'], ['d1', '期限の前日'], ['d0', '期限の当日'], ['late', '期限後'], ['ng', '未実施（期限超過）'], ['wait', '未実施（期限前）'], ['unk', '完了（時刻不明）']]
          .filter(function (x) { return T[x[0]]; })
          .map(function (x) { return { name: x[1], rate: anPct(T[x[0]], tTotal), sub: T[x[0]] + '件', color: x[0] === 'ng' ? '#0f172a' : x[0] === 'late' ? '#94a3b8' : 'var(--acc-600)' }; });

        h += '<div class="an-card"><h3>完了率が上がらない原因の手がかり</h3><p class="an-lead">条件ごとに「期限内に完了」の割合を比べています。差が大きい条件ほど、手を打つ効果が大きいところです。棒にカーソルを合わせると内訳が出ます。</p><div class="sa-grid">';
        h += '<div class="sa-box"><h4>店舗の担当者の人数別</h4><p>担当者が多い店舗ほど低いなら「誰かがやるだろう」が起きています（主担当を決める）。0人の店舗にはリマインドが届きません。</p>' +
          saBars(order(R.aCnt, ['0人（未登録）', '1人', '2人', '3人以上'], function (g, k) { return (aCntStores[k] || 0) + '店舗・' + g.n + '件'; },
            function (g) { return '期限内 ' + g.ok + ' ／ 期限後 ' + g.late + ' ／ 未実施 ' + g.ng + '（対象 ' + g.n + '）'; })) + '</div>';
        h += '<div class="sa-box"><h4>担当者が持っている店舗の数別</h4><p>たくさんの店舗を持つ人ほど低いなら、1人あたりの負担が重すぎます（担当の見直し・まとめメール）。</p>' +

      function filterTasks(list) {

      function getTaskPeopleStats(t) {
        var recipients = getCountableRecipients(t.recipients || []);
        var total = recipients.length;
        var pending = 0;
        for (var i = 0; i < recipients.length; i++) {
          if (!recipients[i].done) pending++;
        }
        var done = total - pending;
        var rate = total ? Math.round((done / total) * 100) : (t.complete ? 100 : (typeof t.progressPct === 'number' ? t.progressPct : 0));
        return { total: total, pending: pending, done: done, rate: rate };
      }

      function getMedianRate(list) {
        var rates = (list || []).map(function (t) {
          return getTaskPeopleStats(t).rate;
        }).sort(function (a, b) {
          return a - b;
        });
        if (!rates.length) return 0;
        var mid = Math.floor(rates.length / 2);
        if (rates.length % 2) return rates[mid];
        return Math.round((rates[mid - 1] + rates[mid]) / 2);
      }

      function getAggregateTaskStats(list) {
        var targetSum = 0;
        var pendingSum = 0;
        (list || []).forEach(function (t) {
          var st = getTaskPeopleStats(t);
          targetSum += st.total;
          pendingSum += st.pending;
        });
        var doneSum = targetSum - pendingSum;
        return {
          taskCount: (list || []).length,
          targetSum: targetSum,
          pendingSum: pendingSum,
          doneSum: doneSum,
          overallRate: targetSum ? Math.round((doneSum / targetSum) * 100) : 0,
          medianRate: getMedianRate(list)
        };
      }

      function anPad(n) { return (n < 10 ? '0' : '') + n; }
      function anFy(d) { return d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; }
      function anKeyOf(unit, d) {
        if (unit === 'month') return d.getFullYear() + '-' + anPad(d.getMonth() + 1);
        if (unit === 'half') return anFy(d) + '-' + (d.getMonth() >= 3 && d.getMonth() <= 8 ? 'H1' : 'H2');
        if (unit === 'fy') return String(anFy(d));
        return 'all';
      }
      function anLabel(unit, key) {
        if (unit === 'month') { var p = key.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
        if (unit === 'half') { var h = key.split('-'); return h[0] + '年度 ' + (h[1] === 'H1' ? '上期（4〜9月）' : '下期（10〜3月）'); }
        if (unit === 'fy') return key + '年度（4月〜翌3月）';
        return '全期間';
      }
      function anKeys(unit) {
        if (unit === 'all') return ['all'];
        var set = {};
        AN.data.tasks.forEach(function (t) { set[anKeyOf(unit, new Date(t.c))] = 1; });
        set[anKeyOf(unit, new Date())] = 1;
        return Object.keys(set).sort();
      }
      function anPrevKey(unit, key) {
        if (unit === 'all') return null;
        var ks = anKeys(unit), i = ks.indexOf(key);
        return i > 0 ? ks[i - 1] : null;
      }
      function anPct(a, b) { return b ? Math.round(a / b * 1000) / 10 : null; }
      function anPctText(v) { return v == null ? '—' : (Math.round(v) + '%'); }
      function anPill(v) {
        if (v == null) return '<span class="an-pill n">—</span>';
        var c = v >= 90 ? 'g' : v >= 70 ? 'y' : 'r';
        return '<span class="an-pill ' + c + '">' + Math.round(v) + '%</span>';
      }
      function anHours(h) {
        if (h == null) return '—';
        if (h < 24) return (Math.round(h * 10) / 10) + '時間';
        return (Math.round(h / 24 * 10) / 10) + '日';
      }
      function anMedian(arr) {
        if (!arr.length) return null;
        var s = arr.slice().sort(function (a, b) { return a - b; });
        var m = Math.floor(s.length / 2);
        return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
      }
      function anSplit(s) {
        return String(s || '').split(/[,、\/／|｜]/).map(function (x) { return x.replace(/[:：].*$/, '').trim(); }).filter(Boolean);
      }

      function anUnitsByTask() {
        if (AN.data._byTask) return AN.data._byTask;
        var by = AN.data.tasks.map(function () { return []; });
        AN.data.units.forEach(function (u) { if (by[u[0]]) by[u[0]].push(u); });
        AN.data._byTask = by;
        return by;
      }
      function anUnitOk(u, t) {
        if (!AN.excl || t.k === 'store') return true;
        var p = AN.data.people[u[1]];
        return !(p && (AN.data.excludeRoles || []).indexOf(p.r) >= 0);
      }
      function anSelectTasks(unit, key) {
        var out = [];
        AN.data.tasks.forEach(function (t, i) {
          if (AN.kind !== 'all' && t.k !== AN.kind) return;
          if (unit !== 'all' && anKeyOf(unit, new Date(t.c)) !== key) return;
          out.push(i);
        });
        return out;
      }

      function anAggregate(tis) {
        var by = anUnitsByTask();
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var todayStr = today.getFullYear() + '-' + anPad(today.getMonth() + 1) + '-' + anPad(today.getDate());
        var A = { tasks: tis.length, units: 0, done: 0, onTime: 0, overdueOpen: 0, hours: [], kinds: { employee: 0, store: 0, tf: 0 },
          requesters: {}, executors: {}, targetsP: {}, perTask: [] };
        tis.forEach(function (ti) {
          var t = AN.data.tasks[ti];
          A.kinds[t.k] = (A.kinds[t.k] || 0) + 1;
          A.requesters[t.s] = 1;
          var pastDue = t.d && t.d < todayStr;
          var tu = 0, td = 0, to = 0;
          by[ti].forEach(function (u) {
            if (!anUnitOk(u, t)) return;
            tu++; td += u[3]; to += u[4];
            if (u[3] && u[5] != null) A.hours.push(u[5]);
            if (!u[3] && pastDue) A.overdueOpen++;
            if (u[3] && u[1] >= 0) A.executors[u[1]] = 1;
            if (t.k !== 'store' && u[1] >= 0) A.targetsP[u[1]] = 1;
          });
          A.units += tu; A.done += td; A.onTime += to;
          A.perTask.push({ ti: ti, total: tu, done: td, onTime: to, pastDue: pastDue });
        });
        A.rate = anPct(A.done, A.units);
        A.onTimeRate = anPct(A.onTime, A.units);
        A.medianHours = anMedian(A.hours);
        A.requesterCount = Object.keys(A.requesters).length;
        A.executorCount = Object.keys(A.executors).length;
        A.targetPeopleCount = Object.keys(A.targetsP).length;
        return A;
      }

      function anRequesterRows(tis) {
        var by = anUnitsByTask(), map = {};
        tis.forEach(function (ti) {
          var t = AN.data.tasks[ti];
          var r = map[t.s] || (map[t.s] = { name: t.s, pi: t.sp, tasks: 0, employee: 0, store: 0, tf: 0, units: 0, done: 0, onTime: 0, hours: [] });
          r.tasks++; r[t.k] = (r[t.k] || 0) + 1;
          by[ti].forEach(function (u) {
            if (!anUnitOk(u, t)) return;
            r.units++; r.done += u[3]; r.onTime += u[4];
            if (u[3] && u[5] != null) r.hours.push(u[5]);
          });
        });
        return Object.keys(map).map(function (k) {
          var r = map[k], p = AN.data.people[r.pi];
          r.team = p ? p.t : ''; r.role = p ? p.r : '';
          r.rate = anPct(r.done, r.units); r.onTimeRate = anPct(r.onTime, r.units); r.med = anMedian(r.hours);
          return r;
        });
      }

      function anExecutorRows(tis) {
        var by = anUnitsByTask(), map = {};
        function rowOf(pi) {
          var p = AN.data.people[pi] || {};
          return map[pi] || (map[pi] = { pi: pi, name: p.n || '—', role: p.r || '', team: p.t || '', area: p.a || '', reg: p.reg,
            targets: 0, done: 0, onTime: 0, storeOps: 0, hours: [] });
        }
        tis.forEach(function (ti) {
          var t = AN.data.tasks[ti];
          by[ti].forEach(function (u) {
            if (u[1] < 0 || !anUnitOk(u, t)) return;
            if (t.k === 'store') {
              if (u[3]) { var s = rowOf(u[1]); s.storeOps++; if (u[5] != null) s.hours.push(u[5]); }
            } else {
              var r = rowOf(u[1]);
              r.targets++; r.done += u[3]; r.onTime += u[4];
              if (u[3] && u[5] != null) r.hours.push(u[5]);
            }
          });
        });
        return Object.keys(map).map(function (k) {
          var r = map[k];
          r.handled = r.done + r.storeOps;
          r.rate = anPct(r.done, r.targets); r.onTimeRate = anPct(r.onTime, r.targets); r.med = anMedian(r.hours);
          r.pending = r.targets - r.done;
          return r;
        });
      }

      function anSortRows(rows, s) {
        return rows.slice().sort(function (a, b) {
          var x = a[s.k], y = b[s.k];
          if (x == null) x = s.d < 0 ? -Infinity : Infinity;
          if (y == null) y = s.d < 0 ? -Infinity : Infinity;
          if (typeof x === 'string') return s.d * String(x).localeCompare(String(y), 'ja');
          return s.d * (x - y) || String(a.name).localeCompare(String(b.name), 'ja');
        });
      }

      function anDelta(cur, prev, unit, invert) {
        if (cur == null || prev == null) return '';
        var d = Math.round((cur - prev) * 10) / 10;
        if (!d) return '<span class="an-delta flat">±0' + unit + '</span>';
        var good = invert ? d < 0 : d > 0;
        return '<span class="an-delta ' + (good ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + d + unit + '</span>';
      }

      function anKpi(label, value, suffix, sub, delta, hero, tip) {
        return '<div class="an-kpi' + (hero ? ' hero' : '') + '"' + (tip ? ' data-tip="' + esc(tip) + '"' : '') + '><span class="k">' + esc(label) + '</span>' +
          '<span class="v">' + value + (suffix ? '<small>' + suffix + '</small>' : '') + (delta || '') + '</span>' +
          '<span class="s">' + (sub || '&nbsp;') + '</span></div>';
      }

      function anTrendSvg() {
        var by = anUnitsByTask();
        var months = {};
        var today = new Date();
        var todayStr = today.getFullYear() + '-' + anPad(today.getMonth() + 1) + '-' + anPad(today.getDate());
        AN.data.tasks.forEach(function (t, ti) {
          if (AN.kind !== 'all' && t.k !== AN.kind) return;
          var k = anKeyOf('month', new Date(t.c));
          var m = months[k] || (months[k] = { employee: 0, store: 0, tf: 0, n: 0, units: 0, done: 0, onTime: 0, notDueTasks: 0, notDueOpen: 0, dueUnits: 0, dueDone: 0 });
          m[t.k]++; m.n++;
          var pastDue = !t.d || t.d < todayStr;
          if (!pastDue) m.notDueTasks++;
          by[ti].forEach(function (u) {
            if (!anUnitOk(u, t)) return;
            m.units++; m.done += u[3]; m.onTime += u[4];
            if (pastDue) { m.dueUnits++; m.dueDone += u[3]; }
            else if (!u[3]) m.notDueOpen++;
          });
        });
        var keys = Object.keys(months).sort();
        if (!keys.length) return '<div class="an-empty">データがありません</div>';
        var first = keys[0].split('-').map(Number), last = anKeyOf('month', new Date()).split('-').map(Number);
        var lk = keys[keys.length - 1].split('-').map(Number);
        if (lk[0] * 12 + lk[1] > last[0] * 12 + last[1]) last = lk;
        var all = [];
        for (var y = first[0], mo = first[1]; y * 12 + mo <= last[0] * 12 + last[1]; mo++) {
          if (mo > 12) { mo = 1; y++; }
          all.push(y + '-' + anPad(mo));
          if (all.length > 36) break;
        }
        if (all.length > 12) all = all.slice(all.length - 12);
        return '<div class="an-trend">' +
          '<div class="an-trend-pane"><h4>依頼数</h4>' + anCountSvg(all, months) +
          '<div class="an-legend"><span><i style="background:' + AN_KIND.employee.color + '"></i>社員依頼</span><span><i style="background:' + AN_KIND.store.color + '"></i>店舗依頼</span><span><i style="background:' + AN_KIND.tf.color + '"></i>TF依頼</span></div></div>' +
          '<div class="an-trend-pane"><h4>実施率</h4>' + anRateSvg(all, months) +
          '<div class="an-legend"><span><i style="background:#0f172a;height:3px;vertical-align:3px"></i>実施率（完了した割合）</span><span><i style="background:#94a3b8;height:3px;vertical-align:3px"></i>期限内に完了した割合</span>' +
          '<span>＊＝期限がまだ来ていない依頼を含む（これから上がります）</span></div></div>' +
          '</div>';
      }

      (function initTips() {
        var tip = document.createElement('div');
        tip.className = 'an-tip';
        tip.hidden = true;
        document.body.appendChild(tip);
        var place = function (e) {
          var x = e.clientX + 14, y = e.clientY + 14;
          var w = tip.offsetWidth, h = tip.offsetHeight;
          if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
          if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
          tip.style.left = Math.max(8, x) + 'px';
          tip.style.top = Math.max(8, y) + 'px';
        };
        document.addEventListener('mouseover', function (e) {
          var el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
          if (!el) { tip.hidden = true; return; }
          tip.textContent = el.getAttribute('data-tip');
          tip.hidden = false;
          place(e);
        });
        document.addEventListener('mousemove', function (e) { if (!tip.hidden) place(e); });
        document.addEventListener('scroll', function () { tip.hidden = true; }, true);
      })();

      /* ================= 人で検索 ================= */
      var PS = { pi: null, range: 'all', filter: 'all', loading: false, cursor: 0 };

      function psNorm(s) { return String(s || '').replace(/[\s\u3000]/g, '').toLowerCase(); }

      function psEnsureData(cb) {
        if (AN.data) { cb(); return; }
        if (PS.loading) return;
        PS.loading = true;
        document.getElementById('psBody').innerHTML = '<div class="loading">データを読み込み中…</div>';
        google.script.run
          .withSuccessHandler(function (d) {
            PS.loading = false;
            if (!d || !d.ok) { document.getElementById('psBody').innerHTML = '<div class="err">' + esc((d && d.message) || '読み込みに失敗しました') + '</div>'; return; }
            AN.data = d;
            cb();
          })
          .withFailureHandler(function (e) {
            PS.loading = false;
            document.getElementById('psBody').innerHTML = '<div class="err">' + esc(e && e.message ? e.message : String(e)) + '</div>';
          })
          .getAdminAnalyticsData();
      }

      function psOpen() {
        document.getElementById('psOverlay').classList.add('open');
        var input = document.getElementById('psInput');
        setTimeout(function () { input.focus(); input.select(); }, 0);
        psEnsureData(function () {
          if (PS.pi == null) document.getElementById('psBody').innerHTML = '<div class="an-empty">名前を入力すると、その人あての依頼をどれだけ期限どおりに完了しているかを確認できます。</div>';
          psRenderSugg();
          if (PS.pi != null) psRenderPerson();
        });
      }
      function psClose() { document.getElementById('psOverlay').classList.remove('open'); }

      function psMatches() {
        if (!AN.data) return [];
        var q = psNorm(document.getElementById('psInput').value);
        var out = [];
        AN.data.people.forEach(function (p, i) {
          if (!p.reg) return;
          if (q && psNorm([p.n, p.e, p.t, p.a, p.r, (p.st || []).join(' ')].join(' ')).indexOf(q) < 0) return;
          out.push(i);
        });
        out.sort(function (a, b) { return String(AN.data.people[a].n).localeCompare(String(AN.data.people[b].n), 'ja'); });
        return out;
      }

      function psRenderSugg() {
        var box = document.getElementById('psSugg');
        var q = document.getElementById('psInput').value.trim();
        if (PS.pi != null && !q) { box.innerHTML = ''; return; }
        var list = psMatches();
        PS.cursor = Math.min(PS.cursor, Math.max(0, list.length - 1));
        if (!list.length) { box.innerHTML = '<div class="an-empty" style="padding:.8rem">該当する人がいません</div>'; return; }
        box.innerHTML = list.slice(0, 40).map(function (pi, i) {
          var p = AN.data.people[pi];
          var sub = [p.t && p.t + 'チーム', p.r, p.a].filter(Boolean).join('・');
          return '<button type="button" data-ps-pi="' + pi + '" class="' + (i === PS.cursor ? 'on' : '') + '">' +
            '<span><span class="nm">' + esc(p.n) + '</span> <span class="sub">' + esc(sub) + '</span></span>' +
            '<span class="sub">' + esc(p.e) + '</span></button>';
        }).join('');
      }

      function psSelect(pi) {
        PS.pi = pi; PS.filter = 'all';
        document.getElementById('psInput').value = '';
        document.getElementById('psSugg').innerHTML = '';
        psRenderPerson();
      }

      function psFmtTime(ms) {
        var d = new Date(ms);
        return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + anPad(d.getHours()) + ':' + anPad(d.getMinutes());
      }
      function psFmtDate(ms) { var d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate(); }
      function psFmtDl(s) { if (!s) return '—'; var p = s.split('-'); return Number(p[1]) + '/' + Number(p[2]); }

      function psInRange(t) {
        if (PS.range === 'all') return true;
        if (PS.range === '90') return t.c >= Date.now() - 90 * 864e5;
        return anKeyOf('half', new Date(t.c)) === anKeyOf('half', new Date());
      }

      /** その人に関係する依頼を1行ずつ。status: ok=期限内に完了 / late=期限後に完了 / ng=期限超過で未実施 / wait=期限前で未実施 */
      function psCollect(pi) {
        var p = AN.data.people[pi];
        var myStores = {};
        (p.st || []).forEach(function (s) { myStores[s] = 1; });
        var by = anUnitsByTask();
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var todayStr = today.getFullYear() + '-' + anPad(today.getMonth() + 1) + '-' + anPad(today.getDate());
        var rows = [], posts = 0;
        var S = {
          person: { total: 0, done: 0, onTime: 0, late: 0, ng: 0, wait: 0, hours: [] },
          store: { total: 0, done: 0, onTime: 0, late: 0, ng: 0, wait: 0, hours: [], self: 0 }
        };
        function statusOf(u, pastDue) {
          if (u[3]) return u[4] ? 'ok' : 'late';
          return pastDue ? 'ng' : 'wait';
        }
        function add(agg, st, u) {
          agg.total++;
          if (st === 'ok') { agg.done++; agg.onTime++; }
          else if (st === 'late') { agg.done++; agg.late++; }
          else agg[st]++;
          if (u[3] && u[5] != null) agg.hours.push(u[5]);
        }
        AN.data.tasks.forEach(function (t, ti) {
          if (!psInRange(t)) return;
          if (t.sp === pi) posts++;
          var pastDue = !!(t.d && t.d < todayStr);
          if (t.k !== 'store') {
            by[ti].forEach(function (u) {
              if (u[1] !== pi) return;
              var st = statusOf(u, pastDue);
              add(S.person, st, u);
              rows.push({ t: t, st: st, doneAt: u[3] && u[5] != null ? t.c + u[5] * 36e5 : null, hours: u[3] ? u[5] : null });
            });
            return;
          }
          var mine = by[ti].filter(function (u) { return myStores[u[2]] || (u[3] && u[1] === pi); });
          if (!mine.length) return;
          var cnt = { ok: 0, late: 0, ng: 0, wait: 0 }, pendingNames = [], lateNames = [], self = 0;
          mine.forEach(function (u) {
            var st = statusOf(u, pastDue);
            cnt[st]++;
            add(S.store, st, u);
            if (u[3] && u[1] === pi) { self++; S.store.self++; }
            if (!u[3]) pendingNames.push(u[2]);
            if (st === 'late') lateNames.push(u[2]);
          });
          var st = cnt.ng ? 'ng' : cnt.wait ? 'wait' : cnt.late ? 'late' : 'ok';
          rows.push({ t: t, st: st, stores: mine.length, done: cnt.ok + cnt.late, self: self, pendingNames: pendingNames, lateNames: lateNames });
        });
        rows.sort(function (a, b) { return b.t.c - a.t.c; });
        return { p: p, rows: rows, S: S, posts: posts };
      }

      var PS_ST = { ok: ['ok', '期限内に完了'], late: ['late', '期限後に完了'], ng: ['ng', '期限超過で未実施'], wait: ['wait', '期限前・未実施'] };

      function psKpis(title, agg, unitLabel, extra) {
        var base = agg.total - agg.wait;
        var onTimeRate = anPct(agg.onTime, base), doneRate = anPct(agg.done, base);
        var h = '<div class="an-card"><h3>' + esc(title) + '</h3>';
        if (!agg.total) return h + '<div class="an-empty">この期間の対象はありません</div></div>';
        h += '<div class="an-kpis" style="margin-top:.7rem">';
        h += anKpi('期限内に完了', anPctText(onTimeRate), '', agg.onTime + ' / ' + base + unitLabel, '', true,
          '期限の日までに完了 ' + agg.onTime + ' ÷ 期限が来た対象 ' + base + unitLabel + '\n期限前でまだ未実施の ' + agg.wait + unitLabel + 'は数えていません。');
        h += anKpi('完了率', anPctText(doneRate), '', agg.done + ' / ' + base + unitLabel, '', false,
          '完了（期限後も含む）' + agg.done + ' ÷ 期限が来た対象 ' + base + unitLabel);
        h += anKpi('期限後に完了', agg.late, unitLabel, '遅れて完了', '', false, '期限の日を過ぎてから「完了」を押した数');
        h += anKpi('期限超過で未実施', agg.ng, unitLabel, '期限が過ぎても未完了', '', false, '期限が過ぎたのに、まだ完了していない数');
        h += anKpi('完了までの時間', anHours(anMedian(agg.hours)), '', '中央値', '', false, '投稿されてから「完了」を押すまでの時間を短い順に並べたときの真ん中の値');
        h += anKpi('届いた数', agg.total, unitLabel, agg.wait ? 'うち期限前 ' + agg.wait + unitLabel : '&nbsp;', '', false, 'この期間に届いた対象の数（期限前のものも含む）');
        if (extra) h += extra;
        return h + '</div></div>';
      }

      function psRenderPerson() {
        if (PS.pi == null || !AN.data) return;
        var R = psCollect(PS.pi), p = R.p;
        var h = '';
        h += '<div class="an-card"><div class="ps-who"><span class="nm">' + esc(p.n) + '</span>' +
          '<span class="sub">' + esc([p.t && p.t + 'チーム', p.r, p.a].filter(Boolean).join('・')) + '</span>' +
          '<span class="sub">' + esc(p.e) + '</span></div>' +
          ((p.st || []).length ? '<p class="an-lead" style="margin-bottom:0">担当店舗（' + p.st.length + '）：' + esc(p.st.join('、')) + '</p>' : '') +
          '<div class="an-row" style="margin-top:.7rem"><span class="an-label">期間</span><div class="an-seg">' +
          [['all', '全期間'], ['half', '今の半期'], ['90', '直近90日']].map(function (o) {
            return '<button type="button" data-ps-range="' + o[0] + '" class="' + (PS.range === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
          }).join('') + '</div><span class="sub" style="font-size:.75rem;color:#64748b;font-weight:600">この期間の投稿 ' + R.posts + '件</span></div></div>';

        h += psKpis('自分あての依頼（社員依頼・TF依頼）', R.S.person, '件');
        h += psKpis('担当店舗の依頼（店舗依頼）', R.S.store, '店舗',
          anKpi('本人が完了', R.S.store.self, '店舗', '担当店舗以外も含む', '', false, 'この人が「完了」を押した店舗の数'));

        var counts = { all: R.rows.length, ng: 0, late: 0, wait: 0, ok: 0 };
        R.rows.forEach(function (r) { counts[r.st]++; });
        var rows = PS.filter === 'all' ? R.rows : R.rows.filter(function (r) { return r.st === PS.filter; });
        h += '<div class="an-card"><h3>依頼ごとの結果 <span class="tag">新しい順</span></h3>' +
          '<p class="an-lead">店舗依頼は、今の担当店舗の分（と本人が完了した店舗）で判定しています。担当が途中で変わった依頼は、前の担当者の分も含まれることがあります。</p>' +

      (function initPersonSearch() {
        var input = document.getElementById('psInput');
        document.getElementById('btnPersonSearch').addEventListener('click', psOpen);
        document.getElementById('psClose').addEventListener('click', psClose);
        document.getElementById('psOverlay').addEventListener('click', function (e) {
          if (e.target.id === 'psOverlay') { psClose(); return; }
          var b = e.target.closest('[data-ps-pi]');
          if (b) { psSelect(Number(b.getAttribute('data-ps-pi'))); return; }
          var r = e.target.closest('[data-ps-range]');
          if (r) { PS.range = r.getAttribute('data-ps-range'); psRenderPerson(); return; }
          var f = e.target.closest('[data-ps-filter]');
          if (f) { PS.filter = f.getAttribute('data-ps-filter'); psRenderPerson(); }
        });
        input.addEventListener('input', function () { PS.cursor = 0; psRenderSugg(); });
        input.addEventListener('focus', psRenderSugg);
        input.addEventListener('keydown', function (e) {
          var list = psMatches();
          if (e.key === 'ArrowDown') { e.preventDefault(); PS.cursor = Math.min(PS.cursor + 1, list.length - 1); psRenderSugg(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); PS.cursor = Math.max(PS.cursor - 1, 0); psRenderSugg(); }
          else if (e.key === 'Enter') { e.preventDefault(); if (list[PS.cursor] != null) psSelect(list[PS.cursor]); }
        });
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && document.getElementById('psOverlay').classList.contains('open')) psClose();
        });
      })();

      function anMonthName(k) {
        var p = k.split('-');
        return p[0] + '年' + Number(p[1]) + '月';
      }

      function anRateTip(k, m) {
        var pct = function (a, b) { return b ? Math.round(a / b * 100) + '%' : '—'; };
        var lines = [
          anMonthName(k) + 'に出した依頼（' + m.n + '件）',
          '',
          '実施率 ' + pct(m.done, m.units),
          '＝ 完了 ' + m.done + ' ÷ 依頼先 ' + m.units + '（人・店舗ののべ数）',
          '',
          '期限内に完了した割合 ' + pct(m.onTime, m.units),
          '＝ 期限内に完了 ' + m.onTime + ' ÷ 依頼先 ' + m.units,
          '',
          '未完了 ' + (m.units - m.done)
        ];
        if (m.notDueTasks) {
          lines.push('うち期限がまだ来ていない依頼の分 ' + m.notDueOpen + '（' + m.notDueTasks + '件の依頼）');
          lines.push('期限が過ぎた依頼だけで見た実施率 ' + pct(m.dueDone, m.dueUnits) + '（' + m.dueDone + ' ÷ ' + m.dueUnits + '）');
        }
        return lines.join('\n');
      }

      function anMonthSelected(k) {
        return AN.unit !== 'all' && anKeyOf(AN.unit, new Date(Number(k.split('-')[0]), Number(k.split('-')[1]) - 1, 15)) === AN.key;
      }

      function anMonthAxis(all, i, x, y) {
        var p = all[i].split('-');
        var sel = anMonthSelected(all[i]);
        var s = '<text x="' + x + '" y="' + y + '" font-size="12" fill="' + (sel ? '#0f172a' : '#64748b') + '" font-weight="' + (sel ? 800 : 600) + '" text-anchor="middle">' + Number(p[1]) + '月</text>';
        if (i === 0 || p[1] === '01') s += '<text x="' + x + '" y="' + (y + 14) + '" font-size="10" fill="#94a3b8" text-anchor="middle">' + p[0] + '年</text>';
        return s;
      }

      function anCountSvg(all, months) {
        var W = 480, H = 240, L = 12, R = 12, T = 26, B = 40;
        var max = 1;
        all.forEach(function (k) { if (months[k] && months[k].n > max) max = months[k].n; });
        var cw = (W - L - R) / all.length, bw = Math.min(44, cw * .6);
        var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="月別の依頼数">';
        s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="#e2e8f0"/>';
        all.forEach(function (k, i) {
          var m = months[k] || { employee: 0, store: 0, tf: 0, n: 0 };
          var cx = L + cw * i + cw / 2, x = cx - bw / 2, yb = H - B;
          if (anMonthSelected(k)) s += '<rect x="' + (L + cw * i + 2) + '" y="4" width="' + (cw - 4) + '" height="' + (H - 8) + '" rx="8" fill="#f1f5f9"/>';
          ['employee', 'store', 'tf'].forEach(function (kk) {
            if (!m[kk]) return;
            var h = (H - T - B) * m[kk] / max;
            yb -= h;
            s += '<rect x="' + x + '" y="' + yb + '" width="' + bw + '" height="' + h + '" fill="' + AN_KIND[kk].color + '"><title>' + k + ' ' + AN_KIND[kk].label + ' ' + m[kk] + '件</title></rect>';
          });
          if (m.n) s += '<text x="' + cx + '" y="' + (yb - 7) + '" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">' + m.n + '件</text>';
          s += anMonthAxis(all, i, cx, H - B + 17);
          if (m.n) {
            var tip = anMonthName(k) + 'の依頼数 ' + m.n + '件\n社員依頼 ' + m.employee + '件 ／ 店舗依頼 ' + m.store + '件 ／ TF依頼 ' + m.tf + '件';
            s += '<rect x="' + (L + cw * i) + '" y="0" width="' + cw + '" height="' + H + '" fill="transparent" data-tip="' + esc(tip) + '"/>';
          }
        });
        return s + '</svg>';
      }

      function anRateSvg(all, months) {
        var W = 480, H = 240, L = 36, R = 16, T = 24, B = 40;
        var cw = (W - L - R) / all.length;
        var yOf = function (pct) { return T + (H - T - B) * (1 - pct / 100); };
        var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="月別の実施率">';
        [0, 50, 100].forEach(function (g) {
          s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yOf(g) + '" y2="' + yOf(g) + '" stroke="' + (g ? '#f1f5f9' : '#e2e8f0') + '"/>';
          s += '<text x="' + (L - 6) + '" y="' + (yOf(g) + 4) + '" font-size="10" fill="#94a3b8" text-anchor="end">' + g + '%</text>';
        });
        var done = [], onTime = [];
        all.forEach(function (k, i) {
          var m = months[k];
          var cx = L + cw * i + cw / 2;
          if (anMonthSelected(k)) s += '<rect x="' + (L + cw * i + 2) + '" y="4" width="' + (cw - 4) + '" height="' + (H - 8) + '" rx="8" fill="#f1f5f9"/>';
          if (m && m.units) {
            done.push([cx, Math.round(m.done / m.units * 100), m.notDueTasks ? '＊' : '']);
            onTime.push([cx, Math.round(m.onTime / m.units * 100)]);
          }
          s += anMonthAxis(all, i, cx, H - B + 17);
        });
        var hover = '';
        all.forEach(function (k, i) {
          var m = months[k];
          if (m && m.units) hover += '<rect x="' + (L + cw * i) + '" y="0" width="' + cw + '" height="' + H + '" fill="transparent" data-tip="' + esc(anRateTip(k, m)) + '"/>';
        });
        var line = function (pts, color, width) {
          if (pts.length > 1) s += '<polyline fill="none" stroke="' + color + '" stroke-width="' + width + '" stroke-linejoin="round" points="' + pts.map(function (p) { return p[0] + ',' + yOf(p[1]); }).join(' ') + '"/>';
        };
        line(onTime, '#94a3b8', 2);
        line(done, '#0f172a', 2.5);
        onTime.forEach(function (p, i) {
          var below = p[1] <= done[i][1] && p[1] > 12;
          s += '<circle cx="' + p[0] + '" cy="' + yOf(p[1]) + '" r="3.5" fill="#fff" stroke="#94a3b8" stroke-width="2"/>';
          s += '<text x="' + p[0] + '" y="' + (yOf(p[1]) + (below ? 16 : -9)) + '" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">' + p[1] + '%</text>';
        });
        done.forEach(function (p, i) {
          var above = p[1] >= onTime[i][1];
          s += '<circle cx="' + p[0] + '" cy="' + yOf(p[1]) + '" r="4" fill="#0f172a"/>';
          s += '<text x="' + p[0] + '" y="' + (yOf(p[1]) + (above ? -10 : 17)) + '" font-size="12.5" font-weight="800" fill="#0f172a" text-anchor="middle">' + p[1] + '%' + p[2] + '</text>';
        });
        return s + hover + '</svg>';
      }

      function anSortTh(table, key, label, num) {
        var s = table === 'req' ? AN.reqSort : AN.execSort;
        var on = s.k === key;
        return '<th class="' + (num ? 'num ' : '') + (on ? 'on' : '') + '" data-an-sort="' + table + ':' + key + '">' + label + (on ? (s.d < 0 ? ' ▼' : ' ▲') : '') + '</th>';

        var h = '<div class="an-tablewrap"><table class="an-table"><thead><tr><th class="rk">#</th>' +

            '<td>' + anBarCell(r.tasks, max, r.tasks + '件') + '<div class="sub">' + esc(mix) + '</div></td>' +
            '<td class="num">' + r.units + '</td><td class="num">' + anPill(r.rate) + '</td><td class="num">' + anPill(r.onTimeRate) + '</td>' +

        return h;

      function anExecutorTable(rows) {
        var q = AN.execQuery.trim();

          return true;

        var sorted = anSortRows(list, AN.execSort);
        var max = 0; list.forEach(function (r) { if (r.handled > max) max = r.handled; });
        var show = AN.execAll ? sorted : sorted.slice(0, 15);
        var h = '<div class="an-tablewrap"><table class="an-table"><thead><tr><th class="rk">#</th>' +
          anSortTh('exec', 'name', 'リストチェック者') + anSortTh('exec', 'handled', 'チェック数') + anSortTh('exec', 'targets', '届いた依頼', true) +

          anSortTh('exec', 'storeOps', '店舗分の完了', true) + anSortTh('exec', 'med', '完了まで（中央値）', true) + '</tr></thead><tbody>';
        show.forEach(function (r, i) {
          h += '<tr><td class="rk">' + (i + 1) + '</td><td><div class="nm">' + esc(r.name) + (r.reg ? '' : ' <span class="sub">（未登録）</span>') + '</div><div class="sub">' +
            esc([r.role, r.area].filter(Boolean).join('・') || '—') + '</div></td>' +
            '<td>' + anBarCell(r.handled, max, r.handled + '件') + '</td>' +

            '<td class="num">' + anPill(r.rate) + '</td><td class="num">' + anPill(r.onTimeRate) + '</td>' +

      function anHBars(items, colorFn) {
        if (!items.length) return '<div class="an-empty">データがありません</div>';
        var max = 0; items.forEach(function (x) { if (x.v > max) max = x.v; });
        return '<div class="an-hbars">' + items.map(function (x) {
          var w = max ? Math.max(2, Math.round(x.v / max * 100)) : 0;
          return '<div class="an-hbar"><span class="nm" title="' + esc(x.name) + '">' + esc(x.name) + '</span>' +
            '<div class="an-bar" style="height:.65rem"><span style="width:' + w + '%;background:' + (colorFn ? colorFn(x) : 'var(--acc-500)') + '"></span></div>' +
            '<span class="val">' + x.text + '</span></div>';
        }).join('') + '</div>';
      }

      function anRateColor(x) { return x.rate == null ? '#e2e8f0' : 'var(--acc-600)'; }

      function renderAnalytics(root) {
        if (!AN.data) { root.innerHTML = '<div class="loading">分析データを集計中…</div>'; return; }
        if (AN.unit !== 'all') {
          var ks = anKeys(AN.unit);
          if (ks.indexOf(AN.key) < 0) AN.key = anKeyOf(AN.unit, new Date());
        } else AN.key = 'all';
        var tis = anSelectTasks(AN.unit, AN.key);
        var A = anAggregate(tis);
        var pk = anPrevKey(AN.unit, AN.key);
        var P = pk ? anAggregate(anSelectTasks(AN.unit, pk)) : null;
        var reqRows = anRequesterRows(tis);
        var execRows = anExecutorRows(tis);
        var periodLabel = anLabel(AN.unit, AN.key);
        var prevLabel = pk ? '前期間（' + anLabel(AN.unit, pk) + '）比' : '';

        var h = '<div class="an">';

        var keys = anKeys(AN.unit), ki = keys.indexOf(AN.key);
        h += '<div class="an-card an-toolbar">';
        h += '<div class="an-row"><span class="an-label">集計期間</span><div class="an-seg">' +
          [['month', '月'], ['half', '上期・下期'], ['fy', '年度'], ['all', '全期間']].map(function (o) {
            return '<button type="button" data-an-unit="' + o[0] + '" class="' + (AN.unit === o[0] ? 'on' : '') + '">' + o[1] + '</button>';
          }).join('') + '</div>';
        if (AN.unit !== 'all') {
          h += '<div class="an-period"><button type="button" class="nav" data-an-step="-1"' + (ki <= 0 ? ' disabled' : '') + ' aria-label="前へ">‹</button>' +
            '<select id="anKeySel">' + keys.slice().reverse().map(function (k) {
              return '<option value="' + k + '"' + (k === AN.key ? ' selected' : '') + '>' + anLabel(AN.unit, k) + '</option>';
            }).join('') + '</select>' +
            '<button type="button" class="nav" data-an-step="1"' + (ki >= keys.length - 1 ? ' disabled' : '') + ' aria-label="次へ">›</button></div>';
        }
        h += '</div>';
        h += '<div class="an-row"><span class="an-label">依頼の種類</span><div class="an-seg">' +
          [['all', 'すべて'], ['employee', '社員'], ['store', '店舗'], ['tf', 'TF']].map(function (o) {

        h += '</div>';

        // KPI
